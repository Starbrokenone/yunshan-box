          ):\n        line = line[1:]\n    if line.endswith(\"|\") and not line.endswith(\"\
          \\\\|\"):\n        line = line[:-1]\n    return line\n\n\ndef _cells(line,\
          \ spaced=False):\n    text = _body(line)\n    values = []\n    start = 0\n\
          \    for i, char in enumerate(text):\n        if char != \"|\":\n      \
          \      continue\n        backslashes = 0\n        k = i - 1\n        while\
          \ k >= 0 and text[k] == \"\\\\\":\n            backslashes += 1\n      \
          \      k -= 1\n        if backslashes % 2:\n            continue\n     \
          \   if spaced and not (i > 0 and i + 1 < len(text)\n                   \
          \        and text[i - 1].isspace() and text[i + 1].isspace()):\n       \
          \     continue\n        values.append(text[start:i])\n        start = i\
          \ + 1\n    values.append(text[start:])\n    return [_clean(value).replace(\"\
          \\\\|\", \"|\") for value in values]\n\n\ndef _separator(line):\n    values\
          \ = _cells(line)\n    return len(values) > 1 and all(re.fullmatch(r\":?-+:?\"\
          , value) for value in values)\n\n\ndef _parse_table(value):\n    if not\
          \ isinstance(value, str):\n        raise ValueError(\"输入必须是提取后的文本\")\n \
          \   text = _clean(value)\n    if text.startswith(\"```\") and text.endswith(\"\
          ```\"):\n        text = re.sub(r\"^```[^\\n]*\\n\", \"\", text)\n      \
          \  text = re.sub(r\"\\n```\\s*$\", \"\", text).strip()\n    if not text:\n\
          \        return []\n    lines = [line.strip() for line in text.splitlines()\
          \ if line.strip()]\n    header_index = next((i - 1 for i in range(1, len(lines))\n\
          \                         if _separator(lines[i])), None)\n    if header_index\
          \ is None and lines[0].startswith(\"|\"):\n        header_index = 0\n  \
          \  if header_index is not None:\n        headers = _cells(lines[header_index])\n\
          \        matrix = []\n        for line in lines[header_index + 1:]:\n  \
          \          if _separator(line):\n                continue\n            if\
          \ \"|\" not in line:\n                raise ValueError(\"Markdown 数据行缺少分隔符\"\
          )\n            spaced = _cells(line, spaced=True)\n            compact =\
          \ _cells(line)\n            if len(spaced) == len(headers):\n          \
          \      row = spaced\n            elif len(compact) == len(headers):\n  \
          \              row = compact\n            else:\n                row = spaced\
          \ if len(spaced) > 1 else compact\n            matrix.append(row)\n    else:\n\
          \        reader = csv.reader(io.StringIO(text, newline=\"\"), strict=True)\n\
          \        headers = next(reader, [])\n        matrix = list(reader)\n   \
          \ headers = [_clean(name).strip(\"`*\\\"'\").strip().lower() for name in\
          \ headers]\n    if not headers or len(headers) != len(set(headers)):\n \
          \       raise ValueError(\"表头为空或重复\")\n    records = []\n    for row in\
          \ matrix:\n        if not any(_clean(value) for value in row):\n       \
          \     continue\n        if len(row) > len(headers):\n            raise ValueError(\"\
          数据列多于表头\")\n        row = row + [\"\"] * (len(headers) - len(row))\n   \
          \     records.append({name: _clean(value) for name, value in zip(headers,\
          \ row)})\n    return records\n\n\ndef _time(value):\n    text = _clean(value)\n\
          \    if not text:\n        return datetime.max\n    try:\n        result\
          \ = datetime.fromisoformat(text.replace(\"/\", \"-\").replace(\"Z\", \"\
          +00:00\"))\n        if result.tzinfo is not None:\n            result =\
          \ result.astimezone(timezone.utc).replace(tzinfo=None)\n        return result\n\
          \    except (ValueError, TypeError, OverflowError):\n        return datetime.max\n\
          \n\n\nclean = _clean\n\ndef j(value):\n    return json.dumps(value, ensure_ascii=False)\n\
          \ndef dt(v):\n    s=clean(v)\n    for fmt in ('%Y-%m-%d %H:%M:%S.%f','%Y/%m/%d\
          \ %H:%M:%S.%f','%Y-%m-%d %H:%M:%S','%Y/%m/%d %H:%M:%S','%Y-%m-%d %H:%M','%Y/%m/%d\
          \ %H:%M','%Y-%m-%dT%H:%M:%S'):\n        try:return datetime.strptime(s,fmt)\n\
          \        except ValueError:pass\n    raise ValueError('无法解析时间')\n\ndef shown(v):return\
          \ dt(v).strftime('%Y/%m/%d %H:%M')\n\ndef review(id,device,reason,advice='人工复核',kind='人工审核'):\n\
          \    return dict(type=kind,id=clean(id) or '-',device=clean(device) or '-',reason=reason,advice=advice)\n\
          \ndef esc(v):\n    return (clean(v) or '-').replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('|','&#124;').replace('\\\
          r','').replace('\\n','<br>')\n\ndef keylogs(w,logs):\n    rank={'CRITICAL':0,'ERROR':1,'WARNING':2};found=[]\n\
          \    anchor=dt(w['alarm_time'])\n    for l in logs:\n        if l.get('device_id')!=w['device_id']\
          \ or l.get('log_level','').upper() not in rank:continue\n        try:ts=dt(l.get('log_time'))\n\
          \        except ValueError:continue\n        if abs(ts-anchor)<=timedelta(minutes=10):found.append(l)\n\
          \    found.sort(key=lambda l:(rank[l['log_level'].upper()],dt(l['log_time'])))\n\
          \    result=[];seen=set()\n    for l in found:\n        k=(l['device_id'],l['log_time'],l['log_content'])\n\
          \        if k not in seen:seen.add(k);result.append(l)\n    return result\n\
          \ndef diagnose(bundle,logs,manuals):\n    issues=[]\n    reviews=list(bundle['reviews'])+issues\n\
          \    valid=[];seen=set()\n    for m in manuals:\n        if not m.get('manual_id')\
          \ or not m.get('device_type') or not m.get('keyword'):\n            reviews.append(review(m.get('manual_id')\
          \ or ('故障维护手册.csv 第'+str(m.get('_row','-'))+'行'),'-','维护手册记录缺少 ID、设备类型或关键词','修正该维护记录'));continue\n\
          \        if m['manual_id'] in seen:continue\n        seen.add(m['manual_id']);valid.append(m)\n\
          \    result=[]\n    for original in bundle['orders']:\n        w=dict(original);ls=keylogs(w,logs);hits=[]\n\
          \        for m in valid:\n            if not w.get('device_type') or m['device_type'].casefold()!=w['device_type'].casefold():continue\n\
          \            words={k.strip() for k in m['keyword'].split('|') if k.strip()}\n\
          \            matched={k for k in words if any(k in l['log_content'] for\
          \ l in ls)}\n            if matched:hits.append((len(matched),m))\n    \
          \    hits.sort(key=lambda x:(-x[0],x[1]['manual_id']))\n        chosen=[h[1]\
          \ for h in hits[:2]]\n        if chosen:w['fault_type']=chosen[0].get('fault_type')\
          \ or w.get('fault_type') or '待确认'\n        w['fault_type']=w.get('fault_type')\
          \ or '待确认'\n        evidence=['｜'.join((m['manual_id'],m.get('fault_type')\
          \ or '-',m.get('evidence') or '-')) for m in chosen]\n        w['evidence1']=evidence[0]\
          \ if evidence else '无'\n        w['evidence2']=evidence[1] if len(evidence)>1\
          \ else ('无第二条证据' if evidence else '无')\n        causes=list(dict.fromkeys(m['root_cause']\
          \ for m in chosen if m.get('root_cause')))\n        actions=list(dict.fromkeys(m['handling_advice']\
          \ for m in chosen if m.get('handling_advice')))\n        w['judgment']=sentence(causes)\
          \ if ls and chosen and causes else '证据不足，转人工复核'\n        w['handling']='；'.join(actions)\
          \ if actions else '转人工复核'\n        w['keylogs']=ls\n        if not ls or\
          \ not chosen or not causes:\n            reason='证据不足：无匹配异常日志' if not ls\
          \ else ('证据不足：未匹配到维护手册条目' if not chosen else '证据不足：维护手册缺少根因')\n        \
          \    reviews.append(review(w['workorder_id'],w['device_id'],reason))\n \
          \       result.append(w)\n    return dict(orders=result,reviews=reviews,manual_count=len(valid))\n\
          \ndef render(bundle,active_count):\n    orders=sorted(bundle['orders'],key=lambda\
          \ w:({'P1':0,'P2':1,'P3':2}[w['priority']],dt(w['alarm_time']),w['workorder_id']))\n\
          \    reviews=bundle['reviews']\n    out=['# 故障诊断报告','','## 一、处置优先级','']\n\
          \    if not active_count:out+=['无 active 告警','']\n    if not orders:out+=['无进入诊断的工单','']\n\
          \    else:\n        out+=['| 优先级 | 工单编号 | 责任专业 | 处理时限 | 设备 | 故障类型 | 影响对象\
          \ | 判断结论 |','| --- | --- | --- | --- | --- | --- | --- | --- |']\n     \
          \   for w in orders:out.append('| '+' | '.join(esc(w.get(k)) for k in ('priority','workorder_id','responsible','sla','device_id','fault_type','impact','judgment'))+'\
          \ |')\n        out.append('')\n    out+=['## 二、分工单处置','']\n    if not orders:out+=['无进入诊断的工单','']\n\
          \    for w in orders:\n        out+=['### 工单 '+w['workorder_id'],'']\n \
          \       fields=[('工单摘要','｜'.join(esc(w.get(k)) for k in ('title','phenomenon','dispatch_reason','diagnosis_summary'))),('设备ID',esc(w.get('device_id'))),('设备类型',esc(w.get('device_type'))),('责任专业',esc(w.get('responsible'))),('处理时限',esc(w.get('sla'))),('告警时间',shown(w['alarm_time'])),('告警级别',esc(w.get('alarm_level'))),('影响对象',esc(w.get('impact'))),('命中策略ID',esc(w.get('policy_id'))),('派单方式','自动派单'\
