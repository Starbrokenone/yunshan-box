            【输入】

            设备聚合包：

            {{#1794215580891.pack#}}


            原生派单知识库检索上下文：

            {{#context#}}


            从检索原文逐字段解析出的策略：

            {{#350.policies#}}


            【处理口径】

            1. pack 按设备聚合，仅用于减少检索次数。必须展开每个设备的 active_alarms，按 alarm_id 逐条判定；同设备的 WARNING
            与 CRITICAL 必须分别判定，不能把 highest_severity 用到所有告警。没有 active_alarms 时不编造告警。

            2. 只允许使用本次实际召回的策略。判断触发条件和排除条件是否与该条告警及已知拓扑相符。持续时长、投诉、割接、供电确认、用户影响等没有提供时，不得编造。潜在后代影响数量不等于已确认用户投诉或业务中断。

            3. 有多个明确命中的策略时，列出全部命中 ID，由下游代码按 P1>P2>P3、policy_id 升序最终选择。P4 已按约定映射 P3；原值保留在
            original_priority。

            4. 具体触发条件优先于场景名称中的概括性词语。例如场景名带 CRITICAL，但触发条件本身未限制级别时，不自行补充 CRITICAL 条件。

            5. DR100 是原文中的兜底规则：仅当它确实被召回、该告警为 active CRITICAL、且没有明确命中其他具体规则时才可以选择。不能自行创建“默认策略”。

            6. 没有确定匹配时，matched_policy_ids 返回空数组，并说明未命中或缺少什么条件；需要补充条件才能确定时 uncertain=true。此类告警交下游人工审核，不生成实际工单。

            7. 派单专业、优先级、自动派单、诊断标志与 SLA 取策略原文，不因模型推测而改写。诊断“可选”按进入诊断处理；空自动派单按否；空诊断标志按是。SLA
            表格保留完整原文，最终报告由代码取明确的响应时限。

            8. 派单原因只描述告警事实、父子拓扑、潜在影响范围和策略依据。不要写诊断结论、维修步骤或将缺失证据当已知事实。

            9. 工单按每条告警的 timestamp、alarm_id 排序；明确命中的告警依次编号 WO-01、WO-02……；未进入诊断的命中工单也占号。未匹配记录工单号填
            -。最终编号以下游代码为准。


            【第一部分：派单决策汇总】

            输出 Markdown 表格，一条 active 告警一行，不遗漏：

            | 工单编号 | 告警ID | 涉及设备 | 设备类型 | 告警现象 | 事件类型 | 影响范围 | 优先级 | 命中策略ID | 自动派单
            | 进入故障诊断 | 派单专业 | SLA要求 |


            事件类型优先取策略 fault_type；未命中填待确认。影响范围可用 pack.impact_scope 并注明是潜在拓扑影响。未匹配字段填
            -，原因写入下一部分和机器判定中。


            【第二部分：标准派单工单】

            每条明确命中的告警独立输出，字段各占一行，使用“**字段名**：内容”：

