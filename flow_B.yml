    - data:
        code: "import csv\nimport io\nimport json\nimport re\nfrom datetime import\
          \ datetime, timezone\n\n\ndef _clean(value):\n    return \"\" if value is\
          \ None else str(value).replace(\"\\ufeff\", \"\").strip()\n\n\ndef _body(line):\n\
          \    line = line.strip()\n    if line.startswith(\"|\"):\n        line =\
          \ line[1:]\n    if line.endswith(\"|\") and not line.endswith(\"\\\\|\"\
          ):\n        line = line[:-1]\n    return line\n\n\ndef _cells(line, spaced=False):\n\
          \    text = _body(line)\n    values = []\n    start = 0\n    for i, char\
          \ in enumerate(text):\n        if char != \"|\":\n            continue\n\
          \        backslashes = 0\n        k = i - 1\n        while k >= 0 and text[k]\
          \ == \"\\\\\":\n            backslashes += 1\n            k -= 1\n     \
          \   if backslashes % 2:\n            continue\n        if spaced and not\
          \ (i > 0 and i + 1 < len(text)\n                           and text[i -\
          \ 1].isspace() and text[i + 1].isspace()):\n            continue\n     \
          \   values.append(text[start:i])\n        start = i + 1\n    values.append(text[start:])\n\
          \    return [_clean(value).replace(\"\\\\|\", \"|\") for value in values]\n\
          \n\ndef _separator(line):\n    values = _cells(line)\n    return len(values)\
          \ > 1 and all(re.fullmatch(r\":?-+:?\", value) for value in values)\n\n\n\
          def _parse_table(value):\n    if not isinstance(value, str):\n        raise\
          \ ValueError(\"输入必须是提取后的文本\")\n    text = _clean(value)\n    if text.startswith(\"\
          ```\") and text.endswith(\"```\"):\n        text = re.sub(r\"^```[^\\n]*\\\
          n\", \"\", text)\n        text = re.sub(r\"\\n```\\s*$\", \"\", text).strip()\n\
          \    if not text:\n        return []\n    lines = [line.strip() for line\
          \ in text.splitlines() if line.strip()]\n    header_index = next((i - 1\
          \ for i in range(1, len(lines))\n                         if _separator(lines[i])),\
          \ None)\n    if header_index is None and lines[0].startswith(\"|\"):\n \
          \       header_index = 0\n    if header_index is not None:\n        headers\
          \ = _cells(lines[header_index])\n        matrix = []\n        for line in\
          \ lines[header_index + 1:]:\n            if _separator(line):\n        \
          \        continue\n            if \"|\" not in line:\n                raise\
          \ ValueError(\"Markdown 数据行缺少分隔符\")\n            spaced = _cells(line, spaced=True)\n\
          \            compact = _cells(line)\n            if len(spaced) == len(headers):\n\
          \                row = spaced\n            elif len(compact) == len(headers):\n\
          \                row = compact\n            else:\n                row =\
          \ spaced if len(spaced) > 1 else compact\n            matrix.append(row)\n\
          \    else:\n        reader = csv.reader(io.StringIO(text, newline=\"\"),\
          \ strict=True)\n        headers = next(reader, [])\n        matrix = list(reader)\n\
          \    headers = [_clean(name).strip(\"`*\\\"'\").strip().lower() for name\
          \ in headers]\n    if not headers or len(headers) != len(set(headers)):\n\
          \        raise ValueError(\"表头为空或重复\")\n    records = []\n    for row in\
          \ matrix:\n        if not any(_clean(value) for value in row):\n       \
          \     continue\n        if len(row) > len(headers):\n            raise ValueError(\"\
          数据列多于表头\")\n        row = row + [\"\"] * (len(headers) - len(row))\n   \
          \     records.append({name: _clean(value) for name, value in zip(headers,\
          \ row)})\n    return records\n\n\ndef _time(value):\n    text = _clean(value)\n\
          \    if not text:\n        return datetime.max\n    try:\n        result\
          \ = datetime.fromisoformat(text.replace(\"/\", \"-\").replace(\"Z\", \"\
          +00:00\"))\n        if result.tzinfo is not None:\n            result =\
          \ result.astimezone(timezone.utc).replace(tzinfo=None)\n        return result\n\
          \    except (ValueError, TypeError, OverflowError):\n        return datetime.max\n\
          \n\ndef main(alarms: str, device_topology: str):\n    empty = {\"queries\"\
          : [], \"pack\": \"[]\"}\n    try:\n        if not _clean(alarms) or not\
          \ _clean(device_topology):\n            return empty\n        alarm_rows\
          \ = _parse_table(alarms)\n        topology_rows = _parse_table(device_topology)\n\
          \        severity_rank = {\"CRITICAL\": 3, \"WARNING\": 2, \"INFO\": 1}\n\
          \        groups = {}\n        seen_alarm_ids = set()\n        for row in\
          \ alarm_rows:\n            if _clean(row.get(\"status\", \"\")).lower()\
          \ != \"active\":\n                continue\n            alarm_id = _clean(row.get(\"\
          alarm_id\", \"\"))\n            if alarm_id and alarm_id in seen_alarm_ids:\n\
          \                continue\n            if alarm_id:\n                seen_alarm_ids.add(alarm_id)\n\
          \            device_id = _clean(row.get(\"device_id\", \"\"))\n        \
          \    if device_id:\n                groups.setdefault(device_id, []).append(row)\n\
          \        if not groups:\n            return empty\n\n        parents = {}\n\
          \        children = {}\n        topology = {}\n        for row in topology_rows:\n\
          \            device_id = _clean(row.get(\"device_id\", \"\"))\n        \
          \    if not device_id:\n                continue\n            topology.setdefault(device_id,\
          \ row)\n            parent = _clean(row.get(\"parent_device_id\", \"\"))\n\
          \            if parent and parent != device_id:\n                parents.setdefault(device_id,\
          \ parent)\n                children.setdefault(parent, set()).add(device_id)\n\
          \n        def descendants(device_id):\n            visited = {device_id}\n\
          \            pending = list(children.get(device_id, set()))\n          \
          \  result = set()\n            while pending:\n                current =\
          \ pending.pop()\n                if current in visited:\n              \
          \      continue\n                visited.add(current)\n                result.add(current)\n\
          \                pending.extend(children.get(current, set()))\n        \
          \    return result\n\n        def severity(row):\n            return _clean(row.get(\"\
          severity\", \"INFO\")).upper() or \"INFO\"\n\n        results = []\n   \
          \     for device_id, rows in groups.items():\n            ordered = sorted(rows,\
          \ key=lambda row: (\n                -severity_rank.get(severity(row), 0),\
          \ _time(row.get(\"timestamp\", \"\"))))\n            representative = next(iter(ordered),\
          \ {})\n            first = min(rows, key=lambda row: _time(row.get(\"timestamp\"\
          , \"\")))\n            first_time = _clean(first.get(\"timestamp\", \"\"\
          ))\n            highest = severity(representative)\n            device_type\
          \ = _clean(representative.get(\"device_type\", \"\"))\n            domain\
          \ = _clean(representative.get(\"domain\", \"\"))\n            if not device_type:\n\
          \                device_type = next((_clean(row.get(\"device_type\", \"\"\
          )) for row in ordered\n                                    if _clean(row.get(\"\
          device_type\", \"\"))), \"\")\n            if not domain:\n            \
          \    domain = next((_clean(row.get(\"domain\", \"\")) for row in ordered\n\
          \                               if _clean(row.get(\"domain\", \"\"))), \"\
          \")\n            device_type = device_type or _clean(topology.get(device_id,\
          \ {}).get(\"device_type\", \"\"))\n            domain = domain or _clean(topology.get(device_id,\
          \ {}).get(\"domain\", \"\"))\n            downstream = descendants(device_id)\n\
          \            ue_count = sum(1 for child in downstream\n                \
          \           if \"UE\" in _clean(topology.get(child, {}).get(\"device_type\"\
          , \"\")).upper())\n            impact = (\"Affects {} descendant devices,\
          \ including {} UEs\".format(len(downstream), ue_count)\n               \
          \       if downstream else \"No descendant devices\")\n            item\
          \ = {\n                \"device_id\": device_id,\n                \"device_type\"\
          : device_type,\n                \"domain\": domain,\n                \"\
          first_alert_time\": first_time,\n                \"highest_severity\": highest,\n\
          \                \"alert_phenomenon\": _clean(representative.get(\"title\"\
          , \"\")),\n                \"parent_device\": parents.get(device_id, \"\"\
          ),\n                \"child_devices\": sorted(children.get(device_id, set())),\n\
          \                \"impact_scope\": impact,\n                \"alarm_type\"\
          : _clean(representative.get(\"alarm_type\", \"\")),\n                \"\
          active_alarms\": [\n                    {\"alarm_id\": _clean(row.get(\"\
          alarm_id\", \"\")),\n                     \"timestamp\": _clean(row.get(\"\
          timestamp\", \"\")),\n                     \"severity\": severity(row),\n\
          \                     \"title\": _clean(row.get(\"title\", \"\")),\n   \
          \                  \"alarm_type\": _clean(row.get(\"alarm_type\", \"\")),\n\
          \                     \"description\": _clean(row.get(\"description\", \"\
          \"))}\n                    for row in sorted(rows, key=lambda row: _time(row.get(\"\
          timestamp\", \"\")))\n                ],\n            }\n            query\
          \ = \" \".join([device_type, domain, highest,\n                        \
          \      _clean(representative.get(\"alarm_type\", \"\"))]).strip()\n    \
          \        results.append(((-severity_rank.get(highest, 0), _time(first_time),\
          \ device_id), query, item))\n        results.sort(key=lambda entry: entry[0])\n\
          \        return {\n            \"queries\": [entry[1] for entry in results],\n\
          \            \"pack\": json.dumps([entry[2] for entry in results], ensure_ascii=False),\n\
          \        }\n    except Exception:\n        return empty\n"
        code_language: python3
