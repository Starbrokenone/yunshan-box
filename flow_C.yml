    - id: '600'
      type: custom
      data:
        type: code
        title: 06｜分流结果校验与汇总
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          from collections import Counter

          ACTIONS=['CREATE','MERGE','MANUAL_REVIEW','NO_TICKET']
          LABELS=['CREATE（新建草稿）','MERGE（合并至在途）','MANUAL_REVIEW（转人工）','NO_TICKET（不建单）']
          FIELDS='case_id customer_id service_id primary_intent secondary_intents verification_result matched_rule_id evidence_id queue_id priority sla_deadline ticket_action existing_ticket_id draft_ticket_id related_ticket_ids reason'.split()

          def cell(value):
              if value is None or value=='':return '-'
              return str(value).replace('|','／').replace('\r',' ').replace('\n',' ')

          def main(case_results, case_items):
              ids=[x['case_id'] for x in case_items]
              if len(ids)!=20 or len(case_results)!=len(ids):
                  raise ValueError('完整性检查失败：必须处理20条诉求且每条恰有一条结果')
              if Counter(ids)!=Counter(x.get('case_id') for x in case_results) or len(set(ids))!=len(ids):
                  raise ValueError('完整性检查失败：结果有重复、遗漏或额外case_id')
              for r in case_results:
                  if set(FIELDS)-set(r):raise ValueError(r.get('case_id','')+'：结果缺少固定字段')
                  a=r['ticket_action']; draft=r['draft_ticket_id']; existing=r['existing_ticket_id']
                  if a not in ACTIONS:raise ValueError('工单动作无效')
                  if a=='CREATE' and (draft!='DRAFT-'+r['case_id'] or existing):raise ValueError('CREATE工单编号不匹配')
                  if a=='MERGE' and (not existing or draft):raise ValueError('MERGE工单编号不匹配')
                  if a in ('MANUAL_REVIEW','NO_TICKET') and (draft or existing):raise ValueError('不应生成工单编号')
                  if a=='NO_TICKET' and (r['priority'] is not None or r['sla_deadline'] is not None):raise ValueError('NO_TICKET优先级与时限必须为空')
                  if a!='NO_TICKET' and (not r['priority'] or not r['sla_deadline']):raise ValueError('处理优先级或时限缺失')
                  if not isinstance(r['secondary_intents'],list) or not isinstance(r['related_ticket_ids'],list):raise ValueError('列表字段类型错误')
                  if existing and existing in r['related_ticket_ids']:raise ValueError('主意图合单目标不得重复放入关联工单')
              results=sorted(case_results,key=lambda r:r['case_id'])
              counts=Counter(r['ticket_action'] for r in results)
              lines=['# 分流与工单草稿报告','','## 一、完整性检查','','- 诉求总数：20','- 结果总数：20','- 结论：完整（每条诉求恰好一条结果，工单动作与编号匹配）','','## 二、工单动作统计','','| 动作 | 数量 |','| --- | --- |']
              for a,label in zip(ACTIONS,LABELS):lines.append('| %s | %d |' % (label,counts[a]))
              lines+=['','## 三、逐条分流明细','','| 序号 | case_id | 客户 | 业务号码 | 主意图 | 核验 | 规则 | 队列 | 优先级 | SLA截止 | 动作 | 工单编号 | 说明 |','| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |']
              for i,r in enumerate(results,1):
                  reason=cell(r['reason'])
                  if len(reason)>60:reason=reason[:59]+'…'
                  values=[i,r['case_id'],r['customer_id'],r['service_id'],r['primary_intent'],r['verification_result'],r['matched_rule_id'],r['queue_id'],r['priority'],r['sla_deadline'],r['ticket_action'],r['draft_ticket_id'] or r['existing_ticket_id'],reason]
                  lines.append('| '+' | '.join(cell(v) for v in values)+' |')
              for action,title in [('MANUAL_REVIEW','四、转人工复核清单'),('NO_TICKET','五、不建单清单（NO_TICKET）')]:
                  selected=[r for r in results if r['ticket_action']==action]
                  if selected:
                      lines+=['','## '+title,'']+['- '+r['case_id']+'：'+cell(r['reason']) for r in selected]
              lines+=['','## 附：说明','','- 本报告仅汇总分流结果，不重新判定意图、业务状态或分流规则。','- CREATE 为工单草稿，MERGE 为合并至已存在在途工单，MANUAL_REVIEW 为转人工复核，NO_TICKET 为非投诉不生成工单。','- 所有工单编号均为草稿或在途引用，本报告不实际创建或派发工单。']
              summary={'case_count':len(ids),'result_count':len(results),'complete':True,'action_counts':{a:counts[a] for a in ACTIONS}}
              return {'summary_json':json.dumps(summary,ensure_ascii=False),'report_md':'\n'.join(lines)}
        variables:
        - variable: case_results
          value_selector:
          - '500'
          - output
        - variable: case_items
          value_selector:
          - '300'
          - case_items
        outputs:
          summary_json:
            type: string
            children: null
          report_md:
            type: string
            children: null
