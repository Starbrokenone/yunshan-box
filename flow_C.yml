      height: 110
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '700'
      type: custom
      data:
        type: code
        title: 07｜图表数据准备
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          from collections import Counter

          def main(summary_json,case_results):
              summary=json.loads(summary_json)
              if not summary.get('complete'):raise ValueError('完整性检查未通过，不生成统计图')
              actions=['CREATE','MERGE','MANUAL_REVIEW','NO_TICKET']
              intents=['BILLING_DISPUTE','MOBILE_NETWORK','BROADBAND_FAULT','INSTALL_DELAY','SERVICE_ATTITUDE','POSITIVE_FEEDBACK']
              counts=Counter(r['primary_intent'] for r in case_results)
              # The supplied exam data uses six categories. Preserve OTHER if it occurs in
              # a later run rather than silently dropping it from the visualization.
              if counts.get('OTHER'):intents.append('OTHER')
              action=[{'category':a,'value':summary['action_counts'][a]} for a in actions]
              intent=[{'category':i,'value':counts[i]} for i in intents]
              if sum(x['value'] for x in action)!=len(case_results) or sum(x['value'] for x in intent)!=len(case_results):raise ValueError('图表统计与结果条数不一致')
              return {'action_chart_data_json':json.dumps(action,ensure_ascii=False),'intent_chart_data_json':json.dumps(intent,ensure_ascii=False)}
        variables:
        - variable: summary_json
          value_selector:
