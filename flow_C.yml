    - id: '850'
      type: custom
      data:
        type: code
        title: 08C｜提取图表图片链接
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          import re

          def url(value):
              if isinstance(value,(dict,list)):
                  if isinstance(value,dict):
                      for k in ('url','imageUrl','image_url','chart_url','result','text','data','output'):
                          if k in value:
                              found=url(value[k])
                              if found:return found
                  else:
                      for item in value:
                          found=url(item)
                          if found:return found
                  return ''
              if not isinstance(value,str):return ''
              text=value.strip()
              if text.startswith(('{','[')):
                  try:
                      found=url(json.loads(text))
                      if found:return found
                  except (ValueError,TypeError):pass
              md=re.search(r'!\[[^\]]*\]\(<?(https?://[^\s)>]+)>?\)',text)
              if md:return md.group(1)
              urls=re.findall(r'https?://[^\s<>"\)\]]+',text)
              # AntV returns a plain URL in text; never return arbitrary error text.
              return urls[0].rstrip('.,;') if urls else ''

          def main(action_text,intent_text,action_json,intent_json):
              a=url(action_text) or url(action_json)
              b=url(intent_text) or url(intent_json)
              if not a or not b:raise ValueError('AntV未返回两张有效图片链接，请检查08A/08B执行结果')
              return {'action_chart_url':a,'intent_chart_url':b}
        variables:
        - variable: action_text
          value_selector:
          - '801'
          - text
        - variable: intent_text
          value_selector:
          - '802'
          - text
        - variable: action_json
          value_selector:
          - '801'
          - json
        - variable: intent_json
          value_selector:
          - '802'
          - json
        outputs:
          action_chart_url:
            type: string
            children: null
          intent_chart_url:
            type: string
            children: null
