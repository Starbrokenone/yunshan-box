    - id: '503'
      type: custom
      data:
        type: code
        title: 05B｜业务核验、分流与工单草稿
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          import re
          from datetime import datetime, timedelta
          from decimal import Decimal, InvalidOperation

          ALLOWED = {'BILLING_DISPUTE','MOBILE_NETWORK','BROADBAND_FAULT','INSTALL_DELAY','SERVICE_ATTITUDE','POSITIVE_FEEDBACK','OTHER'}
          LEVELS = {'普通客户':'normal','VIP客户':'vip','企业客户':'enterprise'}
          FACT_INTENTS = {'BILLING_DISPUTE','MOBILE_NETWORK','BROADBAND_FAULT','INSTALL_DELAY'}

          def candidate_codes(text):
              text = re.sub(r'<think>.*?</think>', '', str(text), flags=re.S).strip()
              if text.startswith('```') and text.endswith('```'):
                  text = '\n'.join(text.splitlines()[1:-1]).strip()
              obj = json.loads(text)
              codes = obj.get('candidate_intents')
              if not isinstance(codes,list) or not codes or any(not isinstance(x,str) or x not in ALLOWED for x in codes):
                  raise ValueError('意图识别输出不是有效的非空候选意图数组，请重试05A')
              codes = list(dict.fromkeys(codes))
              if len(codes)>1:
                  codes = [c for c in codes if c != 'OTHER']
              return codes

          def deadline(received_at, hours):
              return (datetime.fromisoformat(received_at)+timedelta(hours=float(hours))).isoformat(timespec='seconds')

          def manual(result, item, reason):
              result.update(verification_result='UNKNOWN',queue_id='MANUAL_TRIAGE_QUEUE',priority='P2',
                            sla_deadline=deadline(item['received_at'],4),ticket_action='MANUAL_REVIEW',reason=reason,
                            matched_rule_id=None,evidence_id=None,existing_ticket_id=None,draft_ticket_id=None)
              if result['secondary_intents']:
                  result['reason'] += '；副意图：'+','.join(result['secondary_intents'])
              return {'case_result':result}

          def verify(intent, snapshot):
              if intent == 'BILLING_DISPUTE':
                  try:
                      contract=Decimal(snapshot['contract_monthly_fee_yuan'])
                      charged=Decimal(snapshot['charged_monthly_fee_yuan'])
                      if not contract.is_finite() or not charged.is_finite():
                          raise InvalidOperation
                  except (InvalidOperation,KeyError,TypeError):
                      return 'UNKNOWN','月费证据缺失或无法解析，待人工核查'
                  basis='快照约定月费%s元，实收%s元' % (contract,charged)
                  if charged>contract:
                      return 'CONFIRMED',basis+'，支持费用差异，责任待核查'
                  return 'NOT_CONFIRMED',basis+'，未显示超收，仍需解释账单'
              configs={
                  'MOBILE_NETWORK':('network_incident_status','OPEN','NONE','网络事件'),
                  'BROADBAND_FAULT':('access_line_status','DOWN','UP','接入线路'),
                  'INSTALL_DELAY':('install_order_status','DELAYED','COMPLETED','安装单'),
              }
              if intent in configs:
                  field,yes,no,label=configs[intent]
                  status=snapshot.get(field,'')
                  if status == yes:
                      return 'CONFIRMED','快照%s为%s，支持客户反映的问题，责任待核查' % (label,status)
                  if status == no:
                      if intent=='INSTALL_DELAY':
                          return 'NOT_CONFIRMED','快照安装单COMPLETED；客户反映的交付/安装争议仍待核查'
                      return 'NOT_CONFIRMED','快照%s为%s，未支持所述故障，仍需排查客户体验' % (label,status)
                  return 'UNKNOWN','快照%s状态%s，证据不足，待人工核查' % (label,status or '缺失')
              if intent=='SERVICE_ATTITUDE':
                  return 'NOT_CHECKED','客户反映服务态度问题，尚未核实人员行为'
              if intent=='POSITIVE_FEEDBACK':
                  return 'NOT_REQUIRED','非投诉，不生成投诉工单'
              return 'NOT_CHECKED','诉求无法可靠归类，转人工进一步核实'

          def main(item, intent_text, data_json):
              if isinstance(item,str):
                  item=json.loads(item)
              data=json.loads(data_json)
              try:
                  candidates=candidate_codes(intent_text)
              except (ValueError,TypeError,AttributeError) as exc:
                  # Model/protocol failures are execution failures, not customer complaints.
                  raise ValueError(item.get('case_id','')+'：'+str(exc))
              ranks={c:min([int(r['precedence']) for r in data['rules'] if r['intent_code']==c] or [999]) for c in ALLOWED}
              ordered=sorted(candidates,key=lambda c:ranks[c])
              primary=ordered[0]
              result={k:None for k in ('case_id','customer_id','service_id','primary_intent','verification_result','matched_rule_id','evidence_id','queue_id','priority','sla_deadline','ticket_action','existing_ticket_id','draft_ticket_id','reason')}
              result.update(case_id=item['case_id'],customer_id=item.get('customer_id') or None,service_id=item.get('service_id') or None,
                            primary_intent=primary,secondary_intents=[x for x in candidates if x!=primary],related_ticket_ids=[])
              customer=next((x for x in data['customers'] if x['customer_id']==item.get('customer_id')),None)
              snapshot=next((x for x in data['snapshots'] if x['service_id']==item.get('service_id')),None)
              errors=[]
              if not item.get('customer_id'):errors.append('缺少客户号')
              elif customer is None:errors.append('客户号在主档中不存在')
              if not item.get('service_id'):errors.append('缺少业务号码')
              elif snapshot is None:errors.append('找不到对应业务快照')
              if snapshot:
                  conflicts=[f for f in ('customer_id','service_type','region') if snapshot.get(f)!=item.get(f)]
                  if conflicts:errors.append('快照归属不一致（'+','.join(conflicts)+'）')
              trusted = not errors
              if primary!='POSITIVE_FEEDBACK':
                  if primary in FACT_INTENTS and snapshot and snapshot.get('account_status')!='ACTIVE':
                      errors.append('账户非ACTIVE或账户状态缺失')
                  if errors:
                      return manual(result,item,'；'.join(errors))
              verification,basis=verify(primary,snapshot or {})
              result['verification_result']=verification
              if trusted:
                  result['evidence_id']=snapshot.get('evidence_id') or None
              matches=[r for r in data['rules'] if r['intent_code']==primary and r['service_type'] in ('ANY',item['service_type']) and r['verification_result']==verification]
              if not matches:
                  if primary=='POSITIVE_FEEDBACK':
                      result.update(queue_id='NONE',ticket_action='NO_TICKET',reason='非投诉，不生成投诉工单；未找到正面反馈规则')
                      if errors:result['reason']+='；归属核对提示：'+'；'.join(errors)
                      return {'case_result':result}
                  return manual(result,item,'未找到匹配的分流规则，转人工复核')
              rule=min(matches,key=lambda r:int(r['precedence']))
              result['matched_rule_id']=rule['rule_id']
              result['queue_id']=rule['queue_id']
              action=rule['ticket_action']
              if primary=='POSITIVE_FEEDBACK':action='NO_TICKET'
              if action=='NO_TICKET':
                  result.update(ticket_action='NO_TICKET',priority=None,sla_deadline=None)
              else:
                  level=LEVELS[customer['customer_level']]
                  result['priority']=rule['priority_'+level]
                  result['sla_deadline']=deadline(item['received_at'],rule['sla_hours_'+level])
                  active=[t for t in data['tickets'] if t['customer_id']==item['customer_id'] and t['service_id']==item['service_id'] and t['status'] in ('OPEN','IN_PROGRESS')]
                  result['related_ticket_ids']=[t['ticket_id'] for t in active if t['intent_code'] in result['secondary_intents']]
                  if action=='CREATE_OR_MERGE':
                      same=[t for t in active if t['intent_code']==primary]
                      if same:
                          same.sort(key=lambda t:(t['last_updated_at'],t['ticket_id']),reverse=True)
                          result.update(ticket_action='MERGE',existing_ticket_id=same[0]['ticket_id'])
                      else:
                          result.update(ticket_action='CREATE',draft_ticket_id='DRAFT-'+item['case_id'])
                  else:
                      result['ticket_action']='MANUAL_REVIEW'
              # For multi-intent records put secondary and related ticket info first so both
              # survive the report's 60-character limit. Keep full evidence in result.reason.
              details=[]
              if result['secondary_intents']:details.append('副意图：'+','.join(result['secondary_intents']))
              if result['related_ticket_ids']:details.append('关联：'+','.join(result['related_ticket_ids']))
              details.append(basis)
              if primary=='POSITIVE_FEEDBACK' and errors:
                  details.append('归属核对提示：'+'；'.join(errors))
              # Use source text, not model-generated intent_basis, for factual quotations.
              if primary=='INSTALL_DELAY':details.append('客户称“'+item['complaint_text']+'”')
              result['reason']='；'.join(details)
              return {'case_result':result}
        variables:
        - variable: item
          value_selector:
          - '500'
          - item
        - variable: intent_text
          value_selector:
          - '502'
          - text
        - variable: data_json
          value_selector:
          - '300'
          - data_json
