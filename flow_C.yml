    - id: '300'
      type: custom
      data:
        type: code
        title: 03｜五表解析与输入校验
        desc: ''
        selected: false
        code_language: python3
        code: |
          import csv
          import io
          import json
          import re
          from datetime import datetime, timedelta
          from decimal import Decimal, InvalidOperation

          SPECS = {
              'cases': ('01_待处理新诉求', 'case_id', 'case_id received_at channel customer_id service_id service_type region complaint_text'),
              'customers': ('customer_info', 'customer_id', 'customer_id customer_name customer_level source_row_index'),
              'snapshots': ('02_业务核验快照', 'service_id', 'service_id customer_id service_type region snapshot_at account_status bill_cycle contract_monthly_fee_yuan charged_monthly_fee_yuan network_incident_status access_line_status install_order_id install_order_status planned_complete_at evidence_id'),
              'rules': ('03_分流与时限规则', 'rule_id', 'rule_id intent_code service_type verification_result required_fields queue_id precedence priority_normal priority_vip priority_enterprise sla_hours_normal sla_hours_vip sla_hours_enterprise ticket_action'),
              'tickets': ('04_在途与历史工单', 'ticket_id', 'ticket_id customer_id service_id intent_code status created_at last_updated_at owner_queue'),
          }
          INTENTS = {'BILLING_DISPUTE','MOBILE_NETWORK','BROADBAND_FAULT','INSTALL_DELAY','SERVICE_ATTITUDE','POSITIVE_FEEDBACK','OTHER'}

          def cells(line):
              # Keep empty cells. Split only on unescaped pipes, including pandas Markdown.
              line = line.strip()
              if line.startswith('|'):
                  line = line[1:]
              if line.endswith('|') and not line.endswith('\\|'):
                  line = line[:-1]
              result, buf = [], []
              i = 0
              while i < len(line):
                  if line[i:i+2] in ('\\|', '\\\\'):
                      buf.append(line[i+1]); i += 2; continue
                  if line[i] == '|':
                      result.append(''.join(buf).strip()); buf = []
                  else:
                      buf.append(line[i])
                  i += 1
              result.append(''.join(buf).strip())
              return result

          def table(text, name, required):
              if not isinstance(text, str) or not text.strip():
                  raise ValueError(name + '：提取内容为空，请检查对应文件和提取器绑定')
              text = text.lstrip('\ufeff').strip()
              if text.startswith('```') and text.endswith('```'):
                  text = '\n'.join(text.splitlines()[1:-1])
              lines = text.splitlines()
              markdown = None
              for i in range(len(lines)-1):
                  if '|' not in lines[i]:
                      continue
                  sep = cells(lines[i+1])
                  if sep and all(re.fullmatch(r':?-{2,}:?', x) for x in sep):
                      markdown = i; break
              if markdown is not None:
                  header = cells(lines[markdown])
                  matrix = []
                  for line_no, line in enumerate(lines[markdown+2:], markdown+3):
                      if not line.strip():
                          continue
                      row = cells(line)
                      if row == header or all(re.fullmatch(r':?-{2,}:?', x) for x in row):
                          continue
                      if len(row) != len(header):
                          raise ValueError('%s：Markdown 第%d行列数为%d，表头为%d；检查单元格换行/未转义竖线' % (name,line_no,len(row),len(header)))
                      matrix.append(row)
                  # pandas may include an unnamed index column.
                  if header and header[0] == '':
                      header = header[1:]; matrix = [r[1:] for r in matrix]
                  # pandas renders CSV empty cells as nan. UNKNOWN/NONE are preserved.
                  matrix = [['' if v in ('nan','NaN','<NA>') else v for v in r] for r in matrix]
              else:
                  delimiter = '\t' if '\t' in lines[0] and ',' not in lines[0] else ','
                  rows = list(csv.reader(io.StringIO(text), delimiter=delimiter, strict=True))
                  rows = [r for r in rows if any(v.strip() for v in r)]
                  if not rows:
                      raise ValueError(name + '：未读取到表头')
                  header, matrix = rows[0], rows[1:]
              header = [x.strip().lstrip('\ufeff') for x in header]
              if len(set(header)) != len(header):
                  raise ValueError(name + '：表头存在重复列')
              missing = sorted(set(required) - set(header))
              if missing:
                  raise ValueError(name + '：缺少必要列 ' + ', '.join(missing))
              records = []
              for i, row in enumerate(matrix, 2):
                  if len(row) != len(header):
                      raise ValueError('%s：第%d行列数不匹配' % (name,i))
                  records.append({k: v.strip() for k,v in zip(header,row)})
              return records

          def main(case_text, customer_text, snapshot_text, rule_text, ticket_text):
              try:
                  texts = dict(zip(SPECS, [case_text,customer_text,snapshot_text,rule_text,ticket_text]))
                  data = {}
                  for key, (name, pk, required) in SPECS.items():
                      rows = table(texts[key], name, required.split())
                      seen = set()
                      for row_no, row in enumerate(rows, 2):
                          value = row[pk]
                          if not value or value in seen:
                              raise ValueError('%s：第%d行主键%s为空或重复' % (name,row_no,pk))
                          seen.add(value)
                      data[key] = rows
                  if len(data['cases']) != 20:
                      raise ValueError('待处理新诉求应为20条，实际%d条；请检查提取是否漏行' % len(data['cases']))
                  if len(data['customers']) != 2000:
                      raise ValueError('客户主档应为2000条，实际%d条；请检查提取是否截断' % len(data['customers']))
                  if not data['rules']:
                      raise ValueError('分流规则表为空')
                  for row in data['cases']:
                      dt = datetime.fromisoformat(row['received_at'])
                      if dt.utcoffset() != timedelta(hours=8):
                          raise ValueError(row['case_id'] + '：received_at必须带+08:00时区')
                      if row['service_type'] not in ('MOBILE','BROADBAND'):
                          raise ValueError(row['case_id'] + '：service_type不是MOBILE/BROADBAND')
                  for row in data['customers']:
                      if row['customer_level'] not in ('普通客户','VIP客户','企业客户'):
                          raise ValueError(row['customer_id'] + '：客户等级不在题目允许范围内，不自动修改')
                      int(row['source_row_index'])
                  for row in data['rules']:
                      if row['intent_code'] not in INTENTS or row['service_type'] not in ('ANY','MOBILE','BROADBAND'):
                          raise ValueError(row['rule_id'] + '：规则意图或业务类型无效')
                      int(row['precedence'])
                      for level in ('normal','vip','enterprise'):
                          hours = Decimal(row['sla_hours_'+level])
                          if not hours.is_finite() or hours < 0:
                              raise ValueError(row['rule_id'] + '：SLA必须为非负数')
                          if row['priority_'+level] not in ('P1','P2','P3','NONE'):
                              raise ValueError(row['rule_id'] + '：优先级无效')
                      if row['ticket_action'] not in ('CREATE_OR_MERGE','MANUAL_REVIEW','NO_TICKET'):
                          raise ValueError(row['rule_id'] + '：工单动作无效')
                  counts = {key:len(value) for key,value in data.items()}
                  wanted = {r['customer_id'] for r in data['cases']}
                  # Validate the whole master first. Serialize only relevant customers to avoid
                  # Dify's default code-node string-output limit; never reclean customer levels.
                  payload = {key:data[key] for key in ('snapshots','rules','tickets')}
                  payload['customers'] = [r for r in data['customers'] if r['customer_id'] in wanted]
                  payload['input_counts'] = counts
                  encoded = json.dumps(payload,ensure_ascii=False,separators=(',',':'))
                  if len(encoded) > 79000:
                      raise ValueError('本批核验上下文超过代码节点默认字符串上限')
                  return {'parse_ok':True,'parse_message':'五表解析通过：诉求%d，快照%d，规则%d，工单%d，客户%d。业务疑点留待逐条核验。' % (counts['cases'],counts['snapshots'],counts['rules'],counts['tickets'],counts['customers']),'data_json':encoded,'case_items':data['cases']}
              except (ValueError,TypeError,KeyError,csv.Error,InvalidOperation) as exc:
                  return {'parse_ok':False,'parse_message':str(exc),'data_json':'','case_items':[]}
        variables:
        - variable: case_text
          value_selector:
          - '201'
          - text
        - variable: customer_text
          value_selector:
          - '202'
          - text
        - variable: snapshot_text
          value_selector:
          - '203'
          - text
        - variable: rule_text
          value_selector:
          - '204'
          - text
        - variable: ticket_text
          value_selector:
          - '205'
          - text
        outputs:
          parse_ok:
            type: boolean
            children: null
          parse_message:
            type: string
            children: null
          data_json:
            type: string
            children: null
          case_items:
            type: array[object]
            children: null
      position:
        x: 770
        y: 300
      positionAbsolute:
        x: 770
        y: 300
      width: 270
      height: 110
      sourcePosition: right
      targetPosition: left
      selected: false
