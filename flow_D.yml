    - id: '160'
      type: custom
      data:
        type: code
        title: 16 策略结果风险校验
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          from fractions import Fraction as F
          from datetime import datetime

          def main(data_json: str, result_rows_json: str, state_json: str, loop_index: float, slot_count: float) -> dict:
              errors=[]; checked=0
              def check(ok,message):
                  nonlocal checked
                  checked+=1
                  if not ok: errors.append(message)
              try:
                  n=json.loads(data_json)['normalized']; rows=json.loads(result_rows_json); state=json.loads(state_json)
                  if 'error' in state: raise ValueError(state['error'])
                  slots=sorted(n['tasks'],key=lambda x:(x['start_ts'],x['slot_id']))
                  cells={r['cell_id']:r for r in n['cells']}
                  demand={(r['slot_id'],r['cell_id']):F(str(r['demand_units'])) for r in n['traffic']}
                  powers={(r['model_id'],r['state']):r for r in n['powers']}
                  rules={r['rule_key']:r['value'] for r in n['rules']}
                  covers={r['group_id']:r for r in n['coverage']}
                  limit=F(str(rules['max_utilization_ratio'])); minimum=F(str(rules['minimum_incremental_saving_wh']))
                  fee=F(str(rules['switch_energy_wh']))
                  expected=[(s['slot_id'],c) for s in slots for c in sorted(cells)]
                  actual=[(r['slot_id'],r['cell_id']) for r in rows]
                  check(loop_index==slot_count==len(slots),'循环未完整结束')
                  check(len(actual)==len(set(actual)) and set(actual)==set(expected),'结果有缺失、重复、多余或未知的时段×小区组合')
                  check(actual==expected,'结果未按时段开始时间、slot_id、cell_id 升序排列')
                  if errors: raise ValueError('；'.join(errors))
                  old={c:x['initial_state'] for c,x in cells.items()}; streak={c:x['initial_deep_slots'] for c,x in cells.items()}
                  def p(c,st): return powers[cells[c]['model_id'],st]
                  def num(r,k): return F(str(r[k]))
                  def power(c,st,q): return num(p(c,st),'base_power_w')+num(p(c,st),'slope_w_per_unit')*q
                  for slot in slots:
                      sid=slot['slot_id']; rr={r['cell_id']:r for r in rows if r['slot_id']==sid}
                      delta=datetime.fromisoformat(slot['end_time'])-datetime.fromisoformat(slot['start_time'])
                      h=F(str(delta.total_seconds()))/3600
                      incoming={c:F(0) for c in cells}; outgoing=incoming.copy()
                      for c,r in rr.items():
                          tag=sid+'/'+c
                          check(num(r,'original_demand')==demand[sid,c],tag+' 原始业务量不一致')
                          if r['strategy']=='DEEP_SLEEP':
                              target=r['receiver_cell_id']
                              rel=[a for a in n['transfers'] if a['source_cell_id']==c and a['target_cell_id']==target]
                              check(len(rel)==1,tag+' 承接关系不存在或不唯一')
                              if len(rel)!=1: raise ValueError(tag+' 承接关系无效')
                              check(num(r,'transfer_out')<=F(str(rel[0]['max_transfer_units'])),tag+' 单条转移上限超出')
                              check(num(r,'transfer_out')==demand[sid,c] and num(r,'final_demand')==0 and num(r,'transfer_in')==0,tag+' 深休眠没有全量转出原始业务')
                              check(rr[target]['strategy']=='KEEP_ACTIVE',tag+' 承接方未保持运行')
                              incoming[target]+=num(r,'transfer_out'); outgoing[c]+=num(r,'transfer_out')
                          else:
                              check(num(r,'transfer_out')==0 and r['receiver_cell_id'] is None,tag+' 非深休眠存在转出或承接方')
                      check(sum(demand[sid,c] for c in cells)==sum(num(r,'final_demand') for r in rr.values()),sid+' 总业务量不守恒')
                      check(sum(incoming.values())==sum(outgoing.values()),sid+' 转入转出不守恒')
                      running={c:demand[sid,c] for c in cells}; chosen={c:'KEEP_ACTIVE' for c in cells}
                      for c in sorted(cells):
                          r=rr[c]; x=cells[c]; q=demand[sid,c]; final=num(r,'final_demand'); st=r['strategy']; tag=sid+'/'+c
                          check(num(r,'transfer_in')==incoming[c] and num(r,'transfer_out')==outgoing[c] and final==q+incoming[c]-outgoing[c] and final>=0,tag+' 业务平衡不一致')
                          cap=num(p(c,st),'capacity_units')
                          check(num(r,'capacity')==cap and final<=cap*limit,tag+' 最终容量或利用率不合法')
                          forced=any(a['cell_id']==c and max(slot['start_ts'],a['start_ts'])<min(slot['end_ts'],a['end_ts']) for a in n['restrictions'])
                          if x['role']=='ANCHOR': check(st=='KEEP_ACTIVE',tag+' 锚点未保持运行')
                          if forced: check(st=='KEEP_ACTIVE',tag+' 临时保障未保持运行')
                          check(r['previous_state']==old[c] and r['previous_deep_slots']==streak[c],tag+' 前一状态或连续次数错误')
                          newstreak=streak[c]+1 if st=='DEEP_SLEEP' else 0
                          check(r['consecutive_deep_slots']==newstreak<=rules['max_consecutive_deep_slots'],tag+' 连续深休眠超限或计数错误')
                          sw=fee if old[c]!=st else F(0)
                          base=power(c,'KEEP_ACTIVE',q)*h; used=power(c,st,final)*h+sw
                          for k,val in [('switch_energy_wh',sw),('baseline_energy_wh',base),('strategy_energy_wh',used),('saving_wh',base-used)]:
                              check(num(r,k)==val,tag+' '+k+' 复算不一致')
                          want='KEEP_ACTIVE'; reason='COVERAGE_ANCHOR'; target=None; gain=None
                          if x['role']=='BOOSTER':
                              if forced: reason='TEMP_GUARANTEE'
                              elif running[c]>q: reason='LIGHT_NOT_FEASIBLE'
                              else:
                                  options=[]
                                  if q/num(p(c,'KEEP_ACTIVE'),'capacity_units')>F(str(rules['deep_load_ratio_max'])): reason='LOAD_ABOVE_DEEP'
                                  elif streak[c]>=rules['max_consecutive_deep_slots']: reason='DEEP_DURATION_LIMIT'
                                  elif sum(cells[k]['coverage_group']==x['coverage_group'] and chosen[k]!='DEEP_SLEEP' for k in cells)-1<covers[x['coverage_group']]['min_active_cells']: reason='COVERAGE_LIMIT'
                                  else:
                                      reason='RECEIVER_CAPACITY'
                                      rel=sorted([a for a in n['transfers'] if a['source_cell_id']==c],key=lambda a:(a['priority'],a['target_cell_id']))
                                      for a in rel:
                                          t=a['target_cell_id']; after=running[t]+q
                                          if q>F(str(a['max_transfer_units'])) or chosen[t]!='KEEP_ACTIVE' or after>num(p(t,'KEEP_ACTIVE'),'capacity_units')*limit: continue
                                          before=(power(c,'KEEP_ACTIVE',q)+power(t,'KEEP_ACTIVE',running[t]))*h
                                          alternative=(power(c,'DEEP_SLEEP',0)+power(t,'KEEP_ACTIVE',after))*h+(fee if old[c]!='DEEP_SLEEP' else 0)
                                          if before-alternative>minimum: options.append((t,before-alternative))
                                          else: reason='NO_NET_SAVING'
                                  if options:
                                      target,gain=options[0]; want='DEEP_SLEEP'; reason='DEEP_ALLOWED'; running[target]+=q; running[c]=0
                                  else:
                                      g=base-power(c,'LIGHT_SLEEP',q)*h-(fee if old[c]!='LIGHT_SLEEP' else 0)
                                      light=num(p(c,'LIGHT_SLEEP'),'capacity_units')
                                      if q/num(p(c,'KEEP_ACTIVE'),'capacity_units')<=F(str(rules['light_load_ratio_max'])) and light>0 and q<=light*limit and g>minimum:
                                          want='LIGHT_SLEEP'; gain=g
                                      else: reason='LIGHT_NOT_FEASIBLE'
                          check(st==want and r['reason_code']==reason and r['receiver_cell_id']==target,tag+' 策略优先级、承接顺序或原因代码错误')
                          if st=='LIGHT_SLEEP': check(final==q and incoming[c]==0,tag+' 轻载业务量不是原始业务量')
                          if gain is not None: check(num(r,'incremental_saving_wh')==gain and gain>minimum,tag+' 增量节能量不满足严格大于阈值')
                          else: check(r['incremental_saving_wh'] is None,tag+' 非候选策略出现增量节能量')
                          chosen[c]=want; old[c]=st; streak[c]=newstreak
                      for g,a in covers.items():
                          active=sum(cells[c]['coverage_group']==g and rr[c]['strategy']!='DEEP_SLEEP' for c in cells)
                          check(active>=a['min_active_cells'] and rr[a['anchor_cell_id']]['strategy']=='KEEP_ACTIVE',sid+'/'+g+' 覆盖保障不足')
                  check(set(state)==set(cells),'最终状态集合不完整')
                  for c in cells:
                      check(state[c]=={'previous_state':old[c],'deep_slots':streak[c]},c+' 最终循环状态错误')
                  if errors:
                      return {'risk_ok':False,'risk_message':'风险校验未通过：\n'+'\n'.join(errors),'verified_rows_json':''}
                  for r in rows: r['risk_status']='PASS'
                  return {'risk_ok':True,'risk_message':'独立复核通过，共 '+str(len(rows))+' 条结果、'+str(checked)+' 项检查。',
                          'verified_rows_json':json.dumps(rows,ensure_ascii=False,separators=(',',':'),allow_nan=False)}
              except Exception as exc:
                  return {'risk_ok':False,'risk_message':'风险校验失败: '+str(exc),'verified_rows_json':''}
