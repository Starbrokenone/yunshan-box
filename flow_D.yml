        code_language: python3
        code: |
          import json

          def main(summary_json: str, verified_rows_json: str, insight_catalog_json: str, llm_text: str) -> dict:
              summary=json.loads(summary_json); rows=json.loads(verified_rows_json); catalog=json.loads(insight_catalog_json)
              allowed={r['id']:r['text'] for r in catalog}
              try:
                  text=llm_text.strip()
                  if text.startswith('```'): text='\n'.join(text.splitlines()[1:-1])
                  payload=json.loads(text); selected=payload['selected_ids']
                  if not isinstance(selected,list) or not selected or any(not isinstance(k,str) or k not in allowed for k in selected): raise ValueError('解读编号无效')
              except Exception:
                  selected=list(allowed)[:3]
              ids=list(dict.fromkeys(selected))[:3]
              insight='### 重点观察\n\n'+'\n\n'.join(allowed[k] for k in ids) if ids else ''
              slots=summary['slot_summaries']
              common={'width':1400,'height':760,'axisXTitle':'时段','theme':'default','source':'mcp-server-chart'}
              energy=dict(common,type='column',title='分时段基准能耗与策略能耗对比',axisYTitle='能耗（Wh）',group=True,stack=False,
                data=[{'category':s['slot_id'],'value':s[k],'group':g} for s in slots for k,g in [('baseline_energy_wh','基准能耗'),('strategy_energy_wh','策略能耗')]],
                style={'palette':['#8193A8','#167C80'],'backgroundColor':'#FFFFFF'})
              strategies=dict(common,type='column',title='分时段节能策略数量分布',axisYTitle='小区数量（个）',group=True,stack=False,
                data=[{'category':s['slot_id'],'value':s[k],'group':g} for s in slots for k,g in [('KEEP_ACTIVE','保持运行'),('LIGHT_SLEEP','轻载节能'),('DEEP_SLEEP','深度休眠')]],
                style={'palette':['#8193A8','#E5A33B','#167C80'],'backgroundColor':'#FFFFFF'})
              demand=dict(common,type='line',title='小区最终业务量趋势',axisYTitle='最终业务量（业务量单位）',
                data=[{'time':r['slot_id'],'value':float(r['final_demand']),'group':r['cell_id']} for r in rows],
                style={'lineWidth':3,'startAtZero':True,'backgroundColor':'#FFFFFF'})
              return {'energy_json':json.dumps(energy,ensure_ascii=False),'strategies_json':json.dumps(strategies,ensure_ascii=False),
                      'demand_json':json.dumps(demand,ensure_ascii=False),'insight_text':insight}
