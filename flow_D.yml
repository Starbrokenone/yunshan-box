    - id: '140'
      type: custom
      data:
        type: code
        title: 14 当前时段策略计算
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          from decimal import Decimal as D, ROUND_HALF_UP, localcontext

          STATES=['KEEP_ACTIVE','LIGHT_SLEEP','DEEP_SLEEP']
          def dump(x): return json.dumps(x,ensure_ascii=False,separators=(',',':'),default=str,allow_nan=False)
          def fmt(n): return str(D(str(n)).quantize(D('.01'),rounding=ROUND_HALF_UP))

          def main(data_json: str, loop_index: float, slot_count: float, state_json: str,
                   result_rows_json: str, slot_summaries_text: str) -> dict:
              try:
                  with localcontext() as ctx:
                      ctx.prec=50
                      data=json.loads(data_json); n=data['normalized']; ix=data['indexes']
                      i=int(loop_index)
                      if i!=loop_index or int(slot_count)!=len(n['tasks']) or not 0<=i<len(n['tasks']):
                          raise ValueError('循环序号或时段数量无效')
                      old=json.loads(state_json); accumulated=json.loads(result_rows_json)
                      if len(accumulated)!=i*len(n['cells']): raise ValueError('累计结果数量与当前时段序号不一致')
                      slot=n['tasks'][i]; sid=slot['slot_id']; h=D(str(slot['duration_hours']))
                      cells=ix['cells_by_id']; rule=ix['rules_by_key']
                      def param(c,st): return ix['powers_by_model_state'][cells[c]['model_id']][st]
                      def energy(c,st,q):
                          a=param(c,st)
                          return (D(str(a['base_power_w']))+D(str(a['slope_w_per_unit']))*q)*h
                      def switch(c,st): return D(str(rule['switch_energy_wh'])) if old[c]['previous_state']!=st else D(0)
                      def forced(c):
                          return any(r['start_ts']<slot['end_ts'] and r['end_ts']>slot['start_ts'] for r in ix['restrictions_by_cell'][c])
                      original={c:D(str(ix['traffic_by_slot_cell'][sid][c]['demand_units'])) for c in cells}
                      incoming={c:D(0) for c in cells}; outgoing=incoming.copy()
                      chosen={c:'KEEP_ACTIVE' for c in cells}; reasons={}; targets={}; gains={}
                      limit=D(str(rule['max_utilization_ratio'])); minimum=D(str(rule['minimum_incremental_saving_wh']))
                      for c in sorted(cells):
                          x=cells[c]; q=original[c]; base=energy(c,'KEEP_ACTIVE',q)
                          st='KEEP_ACTIVE'; reason='COVERAGE_ANCHOR'; target=None
                          if x['role']=='BOOSTER':
                              if forced(c): reason='TEMP_GUARANTEE'
                              elif incoming[c]>0:
                                  # Receiving original business forbids zero-load deep sleep or original-load-only light sleep.
                                  reason='LIGHT_NOT_FEASIBLE'
                              else:
                                  if q>D(str(param(c,'KEEP_ACTIVE')['capacity_units']))*D(str(rule['deep_load_ratio_max'])):
                                      reason='LOAD_ABOVE_DEEP'
                                  elif old[c]['deep_slots']>=rule['max_consecutive_deep_slots']:
                                      reason='DEEP_DURATION_LIMIT'
                                  elif sum(chosen[k]!='DEEP_SLEEP' for k in ix['cells_by_group'][x['coverage_group']])-1<ix['coverage_by_group'][x['coverage_group']]['min_active_cells']:
                                      reason='COVERAGE_LIMIT'
                                  else:
                                      reason='RECEIVER_CAPACITY'
                                      for link in ix['transfers_by_source'][c]:
                                          t=link['target_cell_id']
                                          if q>D(str(link['max_transfer_units'])) or chosen[t]!='KEEP_ACTIVE': continue
                                          after=original[t]+incoming[t]-outgoing[t]+q
                                          if after>D(str(param(t,'KEEP_ACTIVE')['capacity_units']))*limit: continue
                                          extra=energy(t,'KEEP_ACTIVE',after)-energy(t,'KEEP_ACTIVE',after-q)
                                          gain=base-energy(c,'DEEP_SLEEP',D(0))-switch(c,'DEEP_SLEEP')-extra
                                          if gain<=minimum:
                                              reason='NO_NET_SAVING'; continue
                                          st='DEEP_SLEEP'; reason='DEEP_ALLOWED'; target=t; gains[c]=gain
                                          incoming[t]+=q; outgoing[c]=q
                                          break
                                  if st!='DEEP_SLEEP':
                                      lp=param(c,'LIGHT_SLEEP'); gain=base-energy(c,'LIGHT_SLEEP',q)-switch(c,'LIGHT_SLEEP')
                                      if q<=D(str(param(c,'KEEP_ACTIVE')['capacity_units']))*D(str(rule['light_load_ratio_max'])) and D(str(lp['capacity_units']))>0 and q<=D(str(lp['capacity_units']))*limit and gain>minimum:
                                          st='LIGHT_SLEEP'; gains[c]=gain
                                      else: reason='LIGHT_NOT_FEASIBLE'
                          chosen[c]=st; reasons[c]=reason; targets[c]=target
                      rows=[]; updated={}
                      for c in sorted(cells):
                          st=chosen[c]; q=original[c]+incoming[c]-outgoing[c]; cap=D(str(param(c,st)['capacity_units']))
                          baseline=energy(c,'KEEP_ACTIVE',original[c]); sw=switch(c,st); used=energy(c,st,q)+sw
                          streak=old[c]['deep_slots']+1 if st=='DEEP_SLEEP' else 0
                          rows.append({'slot_id':sid,'cell_id':c,'cell_name':cells[c]['cell_name'],'scene':cells[c]['scene'],
                            'strategy':st,'reason_code':reasons[c],'original_demand':original[c],'transfer_in':incoming[c],
                            'transfer_out':outgoing[c],'final_demand':q,'capacity':cap,'receiver_cell_id':targets[c],
                            'previous_state':old[c]['previous_state'],'previous_deep_slots':old[c]['deep_slots'],
                            'consecutive_deep_slots':streak,'switch_energy_wh':sw,'baseline_energy_wh':baseline,
                            'strategy_energy_wh':used,'saving_wh':baseline-used,'incremental_saving_wh':gains.get(c)})
                          updated[c]={'previous_state':st,'deep_slots':streak}
                      counts={st:sum(r['strategy']==st for r in rows) for st in STATES}
                      text=(sid+'：保持运行 '+str(counts['KEEP_ACTIVE'])+'，轻载节能 '+str(counts['LIGHT_SLEEP'])+
                            '，深度休眠 '+str(counts['DEEP_SLEEP'])+'，业务转移 '+str(sum(r['transfer_out']>0 for r in rows))+
                            ' 次；基准能耗 '+fmt(sum(r['baseline_energy_wh'] for r in rows))+'Wh，策略能耗 '+
                            fmt(sum(r['strategy_energy_wh'] for r in rows))+'Wh，节能量 '+fmt(sum(r['saving_wh'] for r in rows))+'Wh。')
                      return {'loop_index':i+1,'state_json':dump(updated),'result_rows_json':dump(accumulated+rows),
                              'slot_summaries_text':slot_summaries_text+text+'\n'}
              except Exception as exc:
                  # End the loop and route the explicit error through the independent risk gate.
                  return {'loop_index':int(slot_count),'state_json':dump({'error':'时段计算失败: '+str(exc)}),
                          'result_rows_json':result_rows_json,'slot_summaries_text':slot_summaries_text}
        variables:
        - variable: data_json
          value_selector:
          - '100'
          - data_json
          value_type: string
        - variable: loop_index
          value_selector:
          - '130'
          - loop_index
          value_type: number
        - variable: slot_count
          value_selector:
          - '130'
          - slot_count
          value_type: number
        - variable: state_json
          value_selector:
          - '130'
          - state_json
          value_type: string
        - variable: result_rows_json
          value_selector:
          - '130'
          - result_rows_json
          value_type: string
        - variable: slot_summaries_text
          value_selector:
          - '130'
          - slot_summaries_text
          value_type: string
        outputs:
          loop_index:
            type: number
            children: null
          state_json:
            type: string
            children: null
          result_rows_json:
            type: string
            children: null
          slot_summaries_text:
            type: string
            children: null
        isInIteration: false
        isInLoop: true
        loop_id: '130'
      position:
        x: 190
        y: 120
      positionAbsolute:
        x: 1910
        y: 510
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
      parentId: '130'
      zIndex: 1002
      extent: parent
