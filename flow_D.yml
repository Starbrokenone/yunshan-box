    - id: 23C
      type: custom
      data:
        type: code
        title: 23A 图表返回结果检查
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          from urllib.parse import urlparse

          def main(energy_body: str, strategies_body: str, demand_body: str,
                   energy_status: float, strategies_status: float, demand_status: float) -> dict:
              result={'charts_ok':False,'charts_message':'','energy_url':'','strategies_url':'','demand_url':''}
              try:
                  for name,body,status in [('energy',energy_body,energy_status),('strategies',strategies_body,strategies_status),('demand',demand_body,demand_status)]:
                      if status!=200: raise ValueError(name+' 图表 HTTP 状态为 '+str(status))
                      value=json.loads(body)
                      if value.get('success') is not True: raise ValueError(name+' 图表服务未返回成功：'+str(value.get('errorMessage','未知错误')))
                      url=value.get('resultObj'); parsed=urlparse(url) if isinstance(url,str) else None
                      if not parsed or parsed.scheme!='https' or not parsed.netloc or any(c in url for c in ['\n','\r',' ',')','(']):
                          raise ValueError(name+' 图表未返回合法 HTTPS 图片链接')
                      result[name+'_url']=url
                  result.update(charts_ok=True,charts_message='三张 AntV 图表均生成成功')
              except Exception as exc:
                  result['charts_message']='图表生成失败: '+str(exc)
              return result
        variables:
        - variable: energy_body
