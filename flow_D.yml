    - id: '180'
      type: custom
      data:
        type: code
        title: 18 正常策略结果汇总与统计
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          from decimal import Decimal as D, ROUND_HALF_UP, localcontext

          STATES={'KEEP_ACTIVE':'保持运行','LIGHT_SLEEP':'轻载节能','DEEP_SLEEP':'深度休眠'}
          REASONS={'COVERAGE_ANCHOR':'覆盖锚点保障','TEMP_GUARANTEE':'临时保障限制',
           'LOAD_ABOVE_DEEP':'负载高于深休眠阈值，采用轻载节能','DEEP_ALLOWED':'负载满足深度休眠条件',
           'DEEP_ELIGIBLE':'负载满足深度休眠条件','DEEP_DURATION_LIMIT':'达到连续深度休眠上限',
           'LOAD_ABOVE_LIGHT':'负载较高，保持运行','LIGHT_ELIGIBLE':'负载满足轻载节能条件',
           'LIGHT_NOT_FEASIBLE':'轻载条件不满足，保持运行','NO_NET_SAVING':'无正净收益',
           'RECEIVER_CAPACITY':'承接方容量不足','COVERAGE_LIMIT':'覆盖活跃小区数量保障'}
          def dec(x): return D(str(x))
          def f(x): return format(dec(x).quantize(D('.01'),rounding=ROUND_HALF_UP),'f')
          def compact(x): return format(dec(x).normalize(),'f')
          def escape(s): return str(s).replace('\\','\\\\').replace('|','\\|').replace('\r\n','<br>').replace('\n','<br>').replace('\r','<br>')
          def exact_json(x):
              if isinstance(x,D): return format(x,'f')
              if isinstance(x,dict): return '{'+','.join(json.dumps(k,ensure_ascii=False)+':'+exact_json(x[k]) for k in sorted(x))+'}'
              if isinstance(x,list): return '['+','.join(exact_json(a) for a in x)+']'
              return json.dumps(x,ensure_ascii=False,allow_nan=False)
          def table(header,rows):
              return '\n'.join(['| '+' | '.join(header)+' |','| '+' | '.join(['---']*len(header))+' |']+['| '+' | '.join(escape(x) for x in r)+' |' for r in rows])

          def main(data_json: str, verified_rows_json: str) -> dict:
              with localcontext() as ctx:
                  ctx.prec=50
                  data=json.loads(data_json); rows=json.loads(verified_rows_json); n=data['normalized']; rules=data['indexes']['rules_by_key']
                  if not rows or any(r.get('risk_status')!='PASS' for r in rows): raise ValueError('存在未经风险校验的结果')
                  summary={'cell_count':len(n['cells']),'slot_count':len(n['tasks']),'total_rows':len(rows),
                           'strategy_counts':{st:sum(r['strategy']==st for r in rows) for st in STATES},
                           'transfer_count':sum(dec(r['transfer_out'])>0 for r in rows)}
                  for k in ['baseline_energy_wh','strategy_energy_wh','switch_energy_wh','saving_wh']:
                      summary[k]=sum(dec(r[k]) for r in rows)
                  if summary['baseline_energy_wh']<=0: raise ValueError('基准总能耗必须大于 0，无法计算节能率')
                  summary['saving_rate_percent']=(summary['saving_wh']/summary['baseline_energy_wh']*100).quantize(D('.000001'),rounding=ROUND_HALF_UP)
                  slots=[]
                  for slot in n['tasks']:
                      rr=[r for r in rows if r['slot_id']==slot['slot_id']]
                      a={k:slot[k] for k in ['slot_id','start_time','end_time','duration_hours']}
                      a.update({st:sum(r['strategy']==st for r in rr) for st in STATES})
                      a.update({k:sum(dec(r[k]) for r in rr) for k in ['baseline_energy_wh','strategy_energy_wh','switch_energy_wh','saving_wh']})
                      a['transfer_count']=sum(dec(r['transfer_out'])>0 for r in rr); slots.append(a)
                  summary['slot_summaries']=slots
                  analysis=['### 整体节能效果','',
                    '策略范围：共'+str(summary['cell_count'])+'个小区、'+str(summary['slot_count'])+'个时段、'+str(len(rows))+'条策略记录。',
                    '', '策略组成：'+ '，'.join(STATES[k]+str(v)+'次' for k,v in summary['strategy_counts'].items())+'，业务转移'+str(summary['transfer_count'])+'次。','',
                    '基准总能耗'+f(summary['baseline_energy_wh'])+'Wh，策略总能耗'+f(summary['strategy_energy_wh'])+'Wh，其中已包含状态切换能耗'+f(summary['switch_energy_wh'])+'Wh；总节能量'+f(summary['saving_wh'])+'Wh，整体节能率'+f(summary['saving_rate_percent'])+'%。','',
                    '校验结论：全部策略通过覆盖、容量、临时保障、业务守恒、连续休眠、策略顺序和能耗校验。','',
                    '### 分时段策略分析','']
                  for a in slots:
                      analysis += [a['slot_id']+'：'+ '，'.join(STATES[k]+str(a[k]) for k in STATES)+'，业务转移'+str(a['transfer_count'])+'次；基准能耗'+f(a['baseline_energy_wh'])+'Wh，策略能耗'+f(a['strategy_energy_wh'])+'Wh，节能量'+f(a['saving_wh'])+'Wh。','']
                  analysis += ['### 业务转移说明','']
                  for a in slots:
                      transfers=[r for r in rows if r['slot_id']==a['slot_id'] and dec(r['transfer_out'])>0]
                      descriptions=[]
                      for r in transfers:
                          target=next(x for x in rows if x['slot_id']==a['slot_id'] and x['cell_id']==r['receiver_cell_id'])
                          descriptions.append(r['cell_id']+' 向 '+r['receiver_cell_id']+' 转移 '+compact(r['transfer_out'])+' 单位业务，承接方最终业务量 '+compact(target['final_demand'])+'，利用率 '+f(dec(target['final_demand'])/dec(target['capacity'])*100)+'%')
                      analysis += [a['slot_id']+'：'+('；'.join(descriptions) if descriptions else '无业务转移')+'。','']
                  maximum=max(dec(r['final_demand'])/dec(r['capacity'])*100 for r in rows if dec(r['capacity'])>0)
                  analysis += ['容量结论：全部承接方通过容量校验。所有承载小区最高利用率 '+f(maximum)+'%，未超过 '+f(dec(rules['max_utilization_ratio'])*100)+'% 上限。','',
                    '承接方增加的能耗已计入总体策略能耗，因此部分锚点明细的节能量为负值。所有能耗按各时段实际时长计算。']
                  stats=table(['小区数','时段数','记录数','保持运行','轻载节能','深度休眠','业务转移次数'],[[summary['cell_count'],summary['slot_count'],summary['total_rows']]+[summary['strategy_counts'][k] for k in STATES]+[summary['transfer_count']]])
                  stats+='\n\n'+table(['基准总能耗(Wh)','策略总能耗(Wh)','切换总能耗(Wh)','总节能量(Wh)','整体节能率'],[[f(summary[k]) for k in ['baseline_energy_wh','strategy_energy_wh','switch_energy_wh','saving_wh']]+[f(summary['saving_rate_percent'])+'%']])
                  stats+='\n\n'+table(['时段','开始时间','结束时间','时长(h)','保持运行','轻载节能','深度休眠','转移次数','基准能耗(Wh)','策略能耗(Wh)','切换能耗(Wh)','节能量(Wh)'],[[a['slot_id'],a['start_time'],a['end_time'],compact(a['duration_hours'])]+[a[k] for k in STATES]+[a['transfer_count']]+[f(a[k]) for k in ['baseline_energy_wh','strategy_energy_wh','switch_energy_wh','saving_wh']] for a in slots])
                  detail=[]
                  for r in rows:
                      utilization='-' if dec(r['capacity'])==0 else f(dec(r['final_demand'])/dec(r['capacity'])*100)+'%'
                      detail.append([r['slot_id'],r['cell_id'],r['scene'],STATES[r['strategy']],REASONS[r['reason_code']]]+[compact(r[k]) for k in ['original_demand','transfer_in','transfer_out','final_demand','capacity']]+[utilization,r['receiver_cell_id'] or '-']+[f(r[k]) for k in ['switch_energy_wh','baseline_energy_wh','strategy_energy_wh','saving_wh']]+[r['risk_status']])
                  details=table(['时段','小区','场景','策略','原因说明','原始业务量','转入','转出','最终业务量','容量','利用率','承接小区','切换能耗(Wh)','基准能耗(Wh)','策略能耗(Wh)','节能量(Wh)','风险状态'],detail)
                  catalog=[]
                  for code,title in [('TEMP_GUARANTEE','临时保障'),('DEEP_DURATION_LIMIT','连续休眠上限'),('LOAD_ABOVE_DEEP','深休眠负荷率阈值'),('RECEIVER_CAPACITY','承接容量'),('NO_NET_SAVING','增量节能量')]:
                      matched=[r['slot_id']+'/'+r['cell_id'] for r in rows if r['reason_code']==code]
                      if matched: catalog.append({'id':code,'text':'、'.join(matched)+' 的策略受'+title+'约束，已按规则选择可行状态。'})
                  most=max(slots,key=lambda a:a['saving_wh'])
                  catalog.append({'id':'MAX_SAVING','text':most['slot_id']+' 的节能量为 '+f(most['saving_wh'])+'Wh，在本次各时段中最高；各时段持续时间不同。'})
                  return {'analysis_text':'\n'.join(analysis),'statistics_text':stats,'details_text':details,
                          'summary_json':exact_json(summary),'insight_catalog_json':json.dumps(catalog,ensure_ascii=False,separators=(',',':'))}
        variables:
        - variable: data_json
          value_selector:
          - '100'
          - data_json
          value_type: string
        - variable: verified_rows_json
          value_selector:
          - '160'
          - verified_rows_json
          value_type: string
        outputs:
          analysis_text:
            type: string
            children: null
          statistics_text:
            type: string
            children: null
          details_text:
            type: string
            children: null
          summary_json:
            type: string
            children: null
          insight_catalog_json:
            type: string
            children: null
