                  return False
              try:
                  datetime.strptime(value, '%Y/%m/%d %H:%M')
                  return True
              except ValueError:
                  return False

          def main(record_id_csv, handling_id_csv, customer_id_csv, employee_id_csv, hall_id_csv):
              tables = {name: read_csv(text) for name, text in zip(TABLES, [record_id_csv, handling_id_csv, customer_id_csv, employee_id_csv, hall_id_csv])}
              records, handling = index_rows(tables['record'][1]), index_rows(tables['handling'][1])
              for name in ['customer', 'employee', 'hall']:
                  index_rows(tables[name][1])
              deleted = {i for i, row in records.items() if empty(row['complaint_description'])}
              kept = [int(row['source_row_index']) for row in tables['record'][1] if int(row['source_row_index']) not in deleted]
              fill = {'record': Counter(), 'handling': Counter()}
              placeholders = {'record': Counter(), 'handling': Counter()}
              conflict_counts = {'record': Counter(), 'handling': Counter()}
              conflicts, inference, unresolved = [], [], []
              conflict_seen = set()
              conflict_cells = set()
              cross_counts = {'complaint_id': 0, 'accept_time': 0}
              cross_by_table = {'record': Counter(), 'handling': Counter()}
              master_by_table = {'record': Counter(), 'handling': Counter()}
              infer_by_table = {'record': 0, 'handling': 0}

              def conflict(table, sri, column, reason):
                  key = (table, sri, column, reason)
                  if key in conflict_seen:
                      return
                  conflict_seen.add(key)
                  cell = (table, sri, column)
                  if cell not in conflict_cells:
                      conflict_cells.add(cell)
                      conflict_counts[table][column] += 1
                  conflicts.append({'table': table, 'source_row_index': sri, 'column': column, 'reason': reason})

              def set_blank(table, sri, column, value, method):
                  row = records[sri] if table == 'record' else handling[sri]
                  if not empty(row.get(column, '')) or empty(value) or '记录丢失' in str(value):
                      return False
                  if column.endswith('_id') and not valid_id(value, column):
                      return False
                  if column == 'accept_time' and not real_time(value):
                      return False
                  row[column] = value
                  fill[table][column] += 1
                  if method == 'cross_table':
                      cross_counts[column] += 1
                      cross_by_table[table][column] += 1
                  elif method == 'master':
                      master_by_table[table][column] += 1
                  elif method == 'row_inference':
                      infer_by_table[table] += 1
                  return True

              # Snapshot original known IDs BEFORE deletion or filling. A deleted complaint
              # can provide a known neighbour; inferred IDs never become new evidence.
              anchors, blocked = {}, set()
              owners = defaultdict(set)
              for sri in sorted(records.keys() | handling.keys()):
                  values = [mapping[sri].get('complaint_id', '') for mapping in [records, handling] if sri in mapping]
                  known = {v for v in values if valid_id(v, 'complaint_id')}
                  if len(known) == 1 and not any(not empty(v) and not valid_id(v, 'complaint_id') for v in values):
                      anchors[sri] = next(iter(known))
                      owners[anchors[sri]].add(sri)
                  elif len(known) > 1 or any(not empty(v) and not valid_id(v, 'complaint_id') for v in values):
                      blocked.add(sri)
              for sri, value in list(anchors.items()):
                  if len(owners[value]) > 1:
                      del anchors[sri]
                      blocked.add(sri)
              anchor_order = sorted(anchors)

              cname_to_id = relation(tables['customer'][1], 'customer_name', 'customer_id')
              cid_to_name = relation(tables['customer'][1], 'customer_id', 'customer_name')
              ename_to_id = relation(tables['employee'][1], 'handler_name', 'handler_id')
              eid_to_name = relation(tables['employee'][1], 'handler_id', 'handler_name')

              for sri in kept:
                  if sri not in handling:
                      conflict('record', sri, 'source_row_index', 'handling_row_missing')
                      continue
                  r, h = records[sri], handling[sri]
                  if valid_id(r['complaint_id'], 'complaint_id') and valid_id(h['complaint_id'], 'complaint_id') and r['complaint_id'] != h['complaint_id']:
                      conflict('record', sri, 'complaint_id', 'cross_table_conflict')
                      conflict('handling', sri, 'complaint_id', 'cross_table_conflict')
                      continue
                  for column in ['complaint_id', 'accept_time']:
                      a, b = r[column], h[column]
                      if empty(a) and not empty(b):
                          set_blank('record', sri, column, b, 'cross_table')
                      elif empty(b) and not empty(a):
                          set_blank('handling', sri, column, a, 'cross_table')
                      elif not empty(a) and not empty(b) and a != b:
                          conflict('record', sri, column, 'cross_table_conflict')
                          conflict('handling', sri, column, 'cross_table_conflict')

                  pairs = [
                      ('record', 'customer_id', h['customer_name'], cname_to_id, 'handling', 'customer_name', cid_to_name),
                      ('handling', 'handler_id', r['handler_name'], ename_to_id, 'record', 'handler_name', eid_to_name),
                  ]
                  for id_table, id_column, name, name_to_id, name_table, name_column, id_to_name in pairs:
                      id_row = r if id_table == 'record' else h
                      if empty(id_row[id_column]) and not empty(name):
                          candidates = name_to_id.get(name, set())
                          if len(candidates) == 1:
                              candidate = next(iter(candidates))
                              if id_to_name.get(candidate) == {name}:
                                  set_blank(id_table, sri, id_column, candidate, 'master')
                              else:
                                  conflict(id_table, sri, id_column, 'master_id_name_conflict')
                          elif len(candidates) > 1:
                              conflict(id_table, sri, id_column, 'duplicate_name')
                      identifier = id_row[id_column]
                      name_row = r if name_table == 'record' else h
                      candidates = id_to_name.get(identifier, set())
                      if empty(name_row[name_column]) and len(candidates) == 1:
                          set_blank(name_table, sri, name_column, next(iter(candidates)), 'master')
                      elif empty(name_row[name_column]) and len(candidates) > 1:
                          conflict(name_table, sri, name_column, 'master_id_name_conflict')
                      elif not empty(name_row[name_column]) and candidates and name_row[name_column] not in candidates:
                          conflict(name_table, sri, name_column, 'master_relation_conflict')

              inferred_ids = set()
              for sri in kept:
                  if sri not in handling or not empty(records[sri]['complaint_id']) or not empty(handling[sri]['complaint_id']):
                      continue
                  pos = bisect_left(anchor_order, sri)
                  if pos == 0 or pos == len(anchor_order):
                      unresolved.append({'source_row_index': sri, 'reason': 'two_sided_anchors_missing'})
                      continue
                  before, after = anchor_order[pos - 1], anchor_order[pos]
                  left, right = anchors[before], anchors[after]
                  if any(before <= x <= after for x in blocked) or left[2:8] != right[2:8] or int(right[2:]) - int(left[2:]) != after - before:
                      unresolved.append({'source_row_index': sri, 'reason': 'anchors_not_unique_or_sequence_break', 'before': before, 'after': after})
                      continue
                  candidate = 'TS' + str(int(left[2:]) + sri - before).zfill(10)
                  if candidate in owners or candidate in inferred_ids:
                      unresolved.append({'source_row_index': sri, 'reason': 'inferred_id_already_used'})
                      continue
                  count = int(set_blank('record', sri, 'complaint_id', candidate, 'row_inference'))
                  count += int(set_blank('handling', sri, 'complaint_id', candidate, 'row_inference'))
                  if count:
                      inferred_ids.add(candidate)
                      inference.append({'source_row_index': sri, 'complaint_id': candidate, 'filled_cells': count,
                                        'before': {'source_row_index': before, 'complaint_id': left},
                                        'after': {'source_row_index': after, 'complaint_id': right},
                                        'rule': 'id_difference == source_row_difference; both original anchors'})

              # Only truly blank fields get placeholders. Non-empty invalid originals stay
              # intact and are reported. Hall affiliation is never used as reception hall.
              for table, mapping in [('record', records), ('handling', handling)]:
                  for sri in kept:
                      if sri not in mapping:
                          continue
                      row = mapping[sri]
                      for column, marker in MARK.items():
                          if column not in row:
                              continue
                          if empty(row[column]):
                              row[column] = marker
                              placeholders[table][column] += 1
                          elif column.endswith('_id') and not valid_id(row[column], column):
                              conflict(table, sri, column, 'nonempty_invalid_preserved')
                          elif column == 'accept_time' and not real_time(row[column]):
                              conflict(table, sri, column, 'nonempty_invalid_preserved')
              out_record = [r for r in tables['record'][1] if int(r['source_row_index']) not in deleted]
              out_handling = [r for r in tables['handling'][1] if int(r['source_row_index']) not in deleted]
              # Unmatched handling rows are retained and reported, not silently discarded.
              orphan_handling = sorted(handling.keys() - records.keys())
              stats = {}
              for name in ['record', 'handling']:
                  stats[name] = {'filled_cells': sum(fill[name].values()), 'fill_by_field': dict(fill[name]),
                                 'cross_table_by_field': dict(cross_by_table[name]), 'master_by_field': dict(master_by_table[name]),
                                 'inferred_id_cells': infer_by_table[name], 'placeholder_by_field': dict(placeholders[name]),
                                 'conflict_by_field': dict(conflict_counts[name])}
              report = {'tables': stats, 'deleted_count': len(deleted), 'final_count': len(out_record),
                        'handling_final_count': len(out_handling), 'deleted_source_row_indices': sorted(deleted),
                        'cross_id_filled_cells': cross_counts['complaint_id'], 'cross_time_filled_cells': cross_counts['accept_time'],
                        'inferred_id_filled_cells': sum(infer_by_table.values()), 'inferred_complaints': len(inference),
                        'inference_evidence': inference, 'unresolved_inference': unresolved, 'conflicts': conflicts,
                        'orphan_handling_source_rows': orphan_handling}
              return {'record_clean_csv': write_csv(tables['record'][0], out_record),
                      'handling_clean_csv': write_csv(tables['handling'][0], out_handling),
                      'record_fill_count': sum(fill['record'].values()), 'handling_fill_count': sum(fill['handling'].values()),
                      'deleted_count': len(deleted), 'final_count': len(out_record), 'clean_report_json': dump_json(report)}
