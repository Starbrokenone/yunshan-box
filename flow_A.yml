    - id: '1794750000004'
      data:
        title: '08 校验与统计'
        type: code
        code_language: python3
        code: |
          import json

          def main(record_time_count, handling_time_count, record_id_count, handling_id_count,
                   record_fill_count, handling_fill_count, deleted_count, final_count,
                   id_report_json, clean_report_json):
              ids, clean = json.loads(id_report_json), json.loads(clean_report_json)
              # Expected values are used ONLY in this independent verification node.
              # All cleaning nodes calculate their results from inputs.
              checks = [
                  ('投诉记录表时间修复行数', record_time_count, 420),
                  ('投诉处理表时间修复行数', handling_time_count, 415),
                  ('投诉记录表 ID 修复单元格数', record_id_count, 856),
                  ('投诉处理表 ID 修复单元格数', handling_id_count, 1272),
                  ('两张投诉表 ID 修复单元格合计', record_id_count + handling_id_count, 2128),
                  ('客户主表 ID 修复单元格数', ids['tables']['customer']['fixed_cells'], 0),
                  ('员工主表 ID 修复单元格数', ids['tables']['employee']['fixed_cells'], 0),
                  ('营业厅主表 ID 修复单元格数', ids['tables']['hall']['fixed_cells'], 0),
                  ('删除投诉数', deleted_count, 279),
                  ('最终保留投诉数', final_count, 1719),
                  ('投诉 ID 跨表补全单元格数', clean['cross_id_filled_cells'], 448),
                  ('投诉 ID 按原始行序推定单元格数', clean['inferred_id_filled_cells'], 118),
              ]
              all_ok = all(actual == expected for _, actual, expected in checks)
              report = [{'item': label, 'actual': actual, 'expected': expected, 'passed': actual == expected} for label, actual, expected in checks]
              rt, ht = clean['tables']['record'], clean['tables']['handling']
              lines = ['## 清洗结果说明', '',
                       '本次数据集的预设校验项目' + ('全部通过。' if all_ok else '存在差异，请查看下方核对表。'), '',
                       '### 1. 时间与 ID 格式修复', '',
                       '| 指标 | 投诉记录表 | 投诉处理表 | 数字含义 |',
                       '| --- | ---: | ---: | --- |',
                       '| 时间格式修复 | {} 行 | {} 行 | 将非基准格式转换为 年/月/日 时:分；仅有日期时补 00:00，计入修复。原有斜杠日期时间仅补零不计入。 |'.format(record_time_count, handling_time_count),
                       '| ID 格式修复 | {} 个单元格 | {} 个单元格 | 修复原本有值的 ID 写法，如大小写、数字补位、中文序号还原；同一行改两个 ID 计两个。 |'.format(record_id_count, handling_id_count),
                       '| ID 修复涉及记录 | {} 行 | {} 行 | 至少一个 ID 单元格发生格式修复的记录数；同一行只计一次。 |'.format(ids['tables']['record']['affected_rows'], ids['tables']['handling']['affected_rows']),
                       '| ID 还原阶段的空白 ID | {} 个单元格 | {} 个单元格 | 05 节点处理时发现的空白 ID，尚未补全和删除，交给后续节点处理。 |'.format(ids['tables']['record']['blank_ids'], ids['tables']['handling']['blank_ids']),
                       '', '两张投诉表共修复 {} 个非空 ID 单元格。客户、员工、营业厅三张主表分别修复 {}、{}、{} 个 ID 单元格。'.format(record_id_count + handling_id_count, ids['tables']['customer']['fixed_cells'], ids['tables']['employee']['fixed_cells'], ids['tables']['hall']['fixed_cells']),
                       '', '### 2. 缺失值还原与删除', '',
                       '| 指标 | 实际结果 | 数字含义 |', '| --- | ---: | --- |',
                       '| 投诉记录表实际补全 | {} 个单元格 | 最终保留记录中，从空白补成可确认真实值的字段数量。 |'.format(record_fill_count),
                       '| 投诉处理表实际补全 | {} 个单元格 | 与上一指标口径相同，统计投诉处理表。 |'.format(handling_fill_count),
                       '| 投诉 ID 跨表补全 | {} 个单元格 | 同一原始行中，一张表的投诉 ID 为空，从另一张表复制已知 ID；两张表合计。 |'.format(clean['cross_id_filled_cells']),
                       '| 投诉 ID 按行序推定 | {} 个单元格，涉及 {} 条投诉 | 两张表都缺 ID，利用原始行序前后已知编号唯一推定；一条投诉在两张表分别补值，计两个单元格。 |'.format(clean['inferred_id_filled_cells'], clean['inferred_complaints']),
                       '| 受理时间跨表补全 | {} 个单元格 | 从另一张表补入可确认的受理时间；两张表合计。 |'.format(clean['cross_time_filled_cells']),
                       '| 删除投诉 | {} 条 | 投诉描述为空的投诉数；对应处理记录同步删除，不重复计数。 |'.format(deleted_count),
                       '| 最终保留投诉 | {} 条 | 删除后投诉记录表剩余行数。 |'.format(final_count),
                       '| 最终保留处理记录 | {} 条 | 删除后投诉处理表剩余行数。 |'.format(clean['handling_final_count']),
                       '', '实际补全只统计“空白→真实值”。“记录丢失”等占位文字、原本非空的字段以及最终删除的记录，都不计入补全数。',
                       '上述跨表补全与行序推定是实际补全总数的组成部分，不能再与总数相加。',
                       '', '### 3. 最终保留记录的字段明细', '',
                       '| 表 | 字段 | 实际补全单元格 | 填入丢失标记的单元格 | 问题或冲突单元格 |',
                       '| --- | --- | ---: | ---: | ---: |']
              labels = {'complaint_id': '投诉 ID', 'accept_time': '受理时间', 'customer_id': '客户 ID',
                        'customer_name': '客户姓名', 'handler_id': '员工 ID', 'handler_name': '员工姓名',
                        'hall_id': '受理营业厅 ID', 'package_type': '套餐类型', 'complaint_type': '投诉类型',
                        'complaint_subtype': '投诉子类', 'customer_feedback': '客户反馈'}
              for name, label in [('record', '投诉记录表'), ('handling', '投诉处理表')]:
                  info = clean['tables'][name]
                  for field, field_label in labels.items():
                      values = [info[key].get(field, 0) for key in ['fill_by_field', 'placeholder_by_field', 'conflict_by_field']]
                      if any(values):
                          lines.append('| {} | {} | {} | {} | {} |'.format(label, field_label, *values))
              lines += ['', '“丢失标记”表示没有可靠依据还原；“问题或冲突”包括重名无法唯一匹配、关联冲突、保留的非空无效值。同一单元格的多个原因只计一次。',
                        '问题单元格可能同时填入丢失标记，两列不能相加当作缺失总数。员工所属营业厅不用于推定实际受理营业厅。',
                        '', '### 4. 当前数据集校验', '',
                       '| 校验项目 | 实际值 | 校验值 | 结果 |', '| --- | ---: | ---: | --- |']
              lines.extend('| {} | {} | {} | {} |'.format(label, actual, expected, '通过' if actual == expected else '不一致') for label, actual, expected in checks)
              lines.extend(['', '以上校验值仅适用于本次考试数据；更换数据后应以实际计算结果为准。',
                            '输出的五个 MD 文件对应五张表；source_row_index 是从 0 开始的原始记录序号，删除后保留间断，用于追溯来源。'])
              return {'validation_ok': all_ok, 'validation_json': json.dumps(report, ensure_ascii=False, separators=(',', ':')),
                      'check_summary': '\n'.join(lines), 'cross_id_fill_count': clean['cross_id_filled_cells'],
                      'inferred_id_fill_count': clean['inferred_id_filled_cells']}
        variables:
        - variable: record_time_count
          value_selector:
          - '1794725948489'
          - record_fix_count
          value_type: number
        - variable: handling_time_count
          value_selector:
          - '1794725948489'
          - handling_fix_count
          value_type: number
