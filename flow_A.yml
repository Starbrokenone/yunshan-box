    - id: '1794722510259'
      data:
        title: 03 表结构统一
        type: code
        code_language: python3
        code: |
          import csv
          import io
          import json
          import re
          from collections import Counter, defaultdict

          TABLES = ['record', 'handling', 'customer', 'employee', 'hall']
          FIELDS = {
              'record': ['complaint_id', 'accept_time', 'customer_id', 'handler_name', 'package_type', 'complaint_description', 'complaint_type', 'complaint_subtype'],
              'handling': ['complaint_id', 'handler_id', 'hall_id', 'accept_time', 'customer_feedback', 'customer_name'],
              'customer': ['customer_id', 'customer_name', 'customer_level'],
              'employee': ['handler_id', 'handler_name', 'hall_id'],
              'hall': ['hall_id', 'hall_name', 'region'],
          }

          def dump_json(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def empty(value):
              return value is None or str(value).strip() == ''

          def write_csv(header, rows):
              stream = io.StringIO(newline='')
              writer = csv.writer(stream, lineterminator='\n')
              writer.writerow(header)
              writer.writerows([[row.get(key, '') for key in header] for row in rows])
              return stream.getvalue()

          def read_csv(text):
              if not isinstance(text, str) or not text.strip():
                  raise ValueError('上游表格为空或不是字符串')
              records = list(csv.reader(io.StringIO(text, newline=''), strict=True))
              if not records or not records[0] or len(set(records[0])) != len(records[0]):
                  raise ValueError('CSV 表头为空或重复')
              header = records[0]
              rows = []
              for line, cells in enumerate(records[1:], 2):
                  if len(cells) != len(header):
                      raise ValueError('CSV 第 {} 行列数与表头不一致'.format(line))
                  rows.append(dict(zip(header, cells)))
              return header, rows

          def index_rows(rows):
              result = {}
              for row in rows:
                  value = row.get('source_row_index', '')
                  if not re.fullmatch(r'0|[1-9]\d*', str(value)):
                      raise ValueError('source_row_index 缺失或不是非负整数')
                  index = int(value)
                  if index in result:
                      raise ValueError('source_row_index 重复：{}'.format(index))
                  result[index] = row
              return result

          def valid_id(value, column):
              patterns = {'complaint_id': r'TS\d{10}', 'customer_id': r'CUST\d{4}',
                          'handler_id': r'EMP\d{4}', 'hall_id': r'HALL\d{3}'}
              return isinstance(value, str) and re.fullmatch(patterns[column], value) is not None

          def relation(rows, source, target):
              mapping = defaultdict(set)
              for row in rows:
                  a, b = row.get(source, ''), row.get(target, '')
                  if empty(a) or empty(b) or '记录丢失' in str(a) or '记录丢失' in str(b):
                      continue
                  if source.endswith('_id') and not valid_id(a, source):
                      continue
                  if target.endswith('_id') and not valid_id(b, target):
                      continue
                  mapping[a].add(b)
              return mapping


          ALIASES = {
              '投诉id': 'complaint_id', '投诉编号': 'complaint_id', '投诉单号': 'complaint_id',
              '受理时间': 'accept_time', '受理日期': 'accept_time',
              '客户编号': 'customer_id', '客户id': 'customer_id', '客户姓名': 'customer_name',
              '客户名称': 'customer_name', '客户等级': 'customer_level',
              '员工id': 'handler_id', '员工编号': 'handler_id', '处理人id': 'handler_id',
              '员工姓名': 'handler_name', '处理人姓名': 'handler_name',
              '营业厅id': 'hall_id', '营业厅编号': 'hall_id', '营业厅名称': 'hall_name',
              '套餐类型': 'package_type', '套餐': 'package_type', '投诉描述': 'complaint_description',
              '投诉内容': 'complaint_description', '投诉类型': 'complaint_type',
              '投诉子类': 'complaint_subtype', '客户反馈': 'customer_feedback', '区域': 'region', '地区': 'region',
          }

          def column_name(value, index):
              value = value.strip().lstrip('\ufeff')
              if not value:
                  raise ValueError('第 {} 列表头为空'.format(index + 1))
              if value.lower() in ALIASES:
                  return ALIASES[value.lower()]
              value = re.sub(r'([a-z0-9])([A-Z])', r'\1_\2', value).lower()
              value = re.sub(r'[\s\-]+', '_', value).strip('_')
              return value if re.fullmatch(r'[a-z_][a-z0-9_]*', value) else 'extra_column_{}'.format(index + 1)

          def split_md(line):
              line = line.strip()
              if line.startswith('|'):
                  line = line[1:]
              if line.endswith('|') and not line.endswith('\\|'):
                  line = line[:-1]
              cells, buf, i = [], [], 0
              while i < len(line):
                  if line[i] == '\\' and i + 1 < len(line) and line[i + 1] in '|\\':
                      buf.append(line[i + 1]); i += 2
                  elif line[i] == '|':
                      cells.append(''.join(buf).strip()); buf = []; i += 1
                  else:
                      buf.append(line[i]); i += 1
              cells.append(''.join(buf).strip())
              return cells

          def parse_input(text):
              if not isinstance(text, str) or not text.strip():
                  raise ValueError('文档提取结果为空或不是字符串')
              text = text.lstrip('\ufeff')
              lines = text.strip().splitlines()
              if lines[0].strip().startswith('```') and lines[-1].strip() == '```':
                  lines = lines[1:-1]
                  text = '\n'.join(lines)
              if not lines:
                  raise ValueError('没有表头')
              separator = len(lines) > 1 and all(re.fullmatch(r':?-{3,}:?', x) for x in split_md(lines[1]))
              if separator:
                  records = [split_md(lines[0])]
                  if len(split_md(lines[1])) != len(records[0]):
                      raise ValueError('Markdown 分隔行列数不匹配')
                  for number, line in enumerate(lines[2:], 3):
                      if not line.strip():
                          continue
                      cells = split_md(line)
                      if len(cells) != len(records[0]):
                          raise ValueError('Markdown 第 {} 行为 {} 列，表头为 {} 列'.format(number, len(cells), len(records[0])))
                      records.append(cells)
                  return records, 'Markdown'
              if lines[0].strip().startswith('|'):
                  raise ValueError('Markdown 表格缺少合法的表头分隔行')
              records = list(csv.reader(io.StringIO(text, newline=''), strict=True))
              if not records:
                  raise ValueError('没有表头')
              return records, 'CSV'

          def normalize(text, table):
              records, fmt = parse_input(text)
              raw_header = records[0]
              header = [column_name(x, i) for i, x in enumerate(raw_header)]
              if len(set(header)) != len(header):
                  raise ValueError('列名统一后出现重复列：{}'.format(header))
              missing = [x for x in FIELDS[table] if x not in header]
              if missing:
                  raise ValueError('缺少必需列：{}'.format(', '.join(missing)))
              order = FIELDS[table] + [x for x in header if x not in FIELDS[table] and x != 'source_row_index'] + ['source_row_index']
              rows = []
              for i, values in enumerate(records[1:]):
                  if len(values) != len(header):
                      raise ValueError('第 {} 条记录列数不匹配'.format(i + 1))
                  row = dict(zip(header, values))
                  if 'source_row_index' in row and row['source_row_index'] != str(i):
                      raise ValueError('输入已有 source_row_index，但与从 0 开始的原始行序不一致')
                  row['source_row_index'] = str(i)
                  rows.append(row)
              return write_csv(order, rows), '{}：{}，{} 条记录'.format(table, fmt, len(rows))

          def main(record_text, handling_text, customer_text, employee_text, hall_text):
              result = {name + '_csv': '' for name in TABLES}
              messages, errors = [], []
              for name, text in zip(TABLES, [record_text, handling_text, customer_text, employee_text, hall_text]):
