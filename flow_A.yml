          import csv
          import io
          import json
          import re
          from collections import Counter, defaultdict

          TABLES = ['record', 'handling', 'customer', 'employee', 'hall']
          FIELDS = {
              'record': ['complaint_id', 'accept_time', 'customer_id', 'handler_name', 'package_type', 'complaint_description', 'complaint_type', 'complaint_subtype'],
              'handling': ['complaint_id', 'handler_id', 'hall_id', 'accept_time', 'customer_feedback', 'customer_name'],
              'customer': ['customer_id', 'customer_name', 'customer_level'],
              'employee': ['handler_id', 'handler_name', 'hall_id'],
              'hall': ['hall_id', 'hall_name', 'region'],
          }

          def dump_json(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def empty(value):
              return value is None or str(value).strip() == ''

          def write_csv(header, rows):
              stream = io.StringIO(newline='')
              writer = csv.writer(stream, lineterminator='\n')
              writer.writerow(header)
              writer.writerows([[row.get(key, '') for key in header] for row in rows])
              return stream.getvalue()

          def read_csv(text):
              if not isinstance(text, str) or not text.strip():
                  raise ValueError('上游表格为空或不是字符串')
              records = list(csv.reader(io.StringIO(text, newline=''), strict=True))
              if not records or not records[0] or len(set(records[0])) != len(records[0]):
                  raise ValueError('CSV 表头为空或重复')
              header = records[0]
              rows = []
              for line, cells in enumerate(records[1:], 2):
                  if len(cells) != len(header):
                      raise ValueError('CSV 第 {} 行列数与表头不一致'.format(line))
                  rows.append(dict(zip(header, cells)))
              return header, rows

          def index_rows(rows):
              result = {}
              for row in rows:
                  value = row.get('source_row_index', '')
                  if not re.fullmatch(r'0|[1-9]\d*', str(value)):
                      raise ValueError('source_row_index 缺失或不是非负整数')
                  index = int(value)
                  if index in result:
                      raise ValueError('source_row_index 重复：{}'.format(index))
                  result[index] = row
              return result

          def valid_id(value, column):
              patterns = {'complaint_id': r'TS\d{10}', 'customer_id': r'CUST\d{4}',
                          'handler_id': r'EMP\d{4}', 'hall_id': r'HALL\d{3}'}
              return isinstance(value, str) and re.fullmatch(patterns[column], value) is not None

          def relation(rows, source, target):
              mapping = defaultdict(set)
              for row in rows:
                  a, b = row.get(source, ''), row.get(target, '')
                  if empty(a) or empty(b) or '记录丢失' in str(a) or '记录丢失' in str(b):
                      continue
                  if source.endswith('_id') and not valid_id(a, source):
                      continue
                  if target.endswith('_id') and not valid_id(b, target):
                      continue
                  mapping[a].add(b)
              return mapping


          ID_RULES = {
              'complaint_id': ('TS', 10, '投诉单'), 'customer_id': ('CUST', 4, '客户'),
              'handler_id': ('EMP', 4, '员工'), 'hall_id': ('HALL', 3, '营业厅'),
          }

          def normalize_id(raw, column, months):
              if empty(raw):
                  return raw, 'blank'
              value = str(raw).strip()
              if len(value) > 1 and value[0] in '\"\'' and value[-1] == value[0]:
                  value = value[1:-1].strip()
              prefix, digits, chinese = ID_RULES[column]
              chinese_match = re.fullmatch(re.escape(chinese) + r'\s*(\d+)', value)
              if chinese_match:
                  number = int(chinese_match[1]) - 1
                  if number < 0:
                      return raw, 'invalid_one_based_ordinal'
                  tail = str(number)
              else:
                  match = re.fullmatch(re.escape(prefix) + r'(\d+)', value.upper())
                  if match:
                      tail = match[1]
                  elif re.fullmatch(r'\d+', value):
                      tail = value
                  else:
                      return raw, 'unrecognized'
              if column == 'complaint_id':
                  if 7 <= len(tail) <= 10 and not chinese_match:
                      match = re.fullmatch(r'(\d{4}(?:0[1-9]|1[0-2]))(\d{1,4})', tail)
                      if not match:
                          return raw, 'invalid_year_month'
                      return prefix + match[1] + match[2].zfill(4), None
                  if len(tail) <= 4 and len(months) == 1:
                      return prefix + next(iter(months)) + tail.zfill(4), None
                  return raw, 'ambiguous_month_or_width'
              if len(tail) <= digits:
                  return prefix + tail.zfill(digits), None
              return raw, 'invalid_width'

          def main(record_time_csv, handling_time_csv, customer_csv, employee_csv, hall_csv):
              source = dict(zip(TABLES, [record_time_csv, handling_time_csv, customer_csv, employee_csv, hall_csv]))
              tables = {name: read_csv(text) for name, text in source.items()}
              for header, rows in tables.values():
                  index_rows(rows)
              months = set()
              for name in ['record', 'handling']:
                  for row in tables[name][1]:
                      match = re.fullmatch(r'(?:TS)?(\d{4}(?:0[1-9]|1[0-2]))\d{4}', row['complaint_id'].strip(), re.I)
                      if match:
                          months.add(match[1])
              reports, unresolved, conflicts = {}, [], []
              for name in ['customer', 'employee', 'hall', 'record', 'handling']:
                  header, rows = tables[name]
                  fixed, blanks, affected = Counter(), Counter(), set()
                  for row in rows:
                      for column in [x for x in header if x in ID_RULES]:
                          raw = row[column]
                          candidate, reason = normalize_id(raw, column, months)
                          sri = int(row['source_row_index'])
                          if reason == 'blank':
                              blanks[column] += 1
                          elif reason:
                              unresolved.append({'table': name, 'source_row_index': sri, 'column': column, 'raw': raw, 'reason': reason})
                          elif candidate != raw:
                              row[column] = candidate
                              fixed[column] += 1
                              affected.add(sri)
                  reports[name] = {'fixed_cells': sum(fixed.values()), 'fixed_by_field': dict(fixed),
                                   'affected_rows': len(affected), 'blank_ids': sum(blanks.values()), 'blank_by_field': dict(blanks)}
              # Canonical IDs are checked against master keys and cross-table relationships.
              # Conflicting non-empty values are reported, never silently replaced by a name match.
              checks = [('record', 'customer_id', 'customer'), ('handling', 'handler_id', 'employee'),
                        ('handling', 'hall_id', 'hall'), ('employee', 'hall_id', 'hall')]
              for name, column, master in checks:
                  allowed = {r[column] for r in tables[master][1] if valid_id(r[column], column)}
                  for row in tables[name][1]:
                      if valid_id(row[column], column) and row[column] not in allowed:
                          conflicts.append({'table': name, 'source_row_index': int(row['source_row_index']), 'column': column, 'value': row[column], 'reason': 'not_in_master'})
              record_map, handling_map = index_rows(tables['record'][1]), index_rows(tables['handling'][1])
              customers = relation(tables['customer'][1], 'customer_id', 'customer_name')
              employees = relation(tables['employee'][1], 'handler_id', 'handler_name')
              for sri in record_map.keys() & handling_map.keys():
                  record, handling = record_map[sri], handling_map[sri]
                  a, b = record['complaint_id'], handling['complaint_id']
                  if valid_id(a, 'complaint_id') and valid_id(b, 'complaint_id') and a != b:
                      conflicts.append({'table': 'record/handling', 'source_row_index': sri, 'column': 'complaint_id', 'reason': 'cross_table_conflict', 'values': [a, b]})
                  for mapping, key, value, column in [(customers, record['customer_id'], handling['customer_name'], 'customer_id/customer_name'),
                                                       (employees, handling['handler_id'], record['handler_name'], 'handler_id/handler_name')]:
                      if key in mapping and not empty(value) and (len(mapping[key]) != 1 or value not in mapping[key]):
                          conflicts.append({'table': 'record/handling', 'source_row_index': sri, 'column': column, 'reason': 'master_relation_conflict'})
              output = {name + '_id_csv': write_csv(*tables[name]) for name in TABLES}
              output['record_fix_count'] = reports['record']['fixed_cells']
              output['handling_fix_count'] = reports['handling']['fixed_cells']
              output['id_report_json'] = dump_json({'tables': reports, 'complaint_month_candidates': sorted(months),
                                                   'unresolved': unresolved, 'conflicts': conflicts,
                                                   'total_fixed_cells': sum(r['fixed_cells'] for r in reports.values())})
              return output
