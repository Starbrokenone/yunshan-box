        code: |
          import csv
          import io
          import json
          import re
          from collections import Counter, defaultdict

          TABLES = ['record', 'handling', 'customer', 'employee', 'hall']
          FIELDS = {
              'record': ['complaint_id', 'accept_time', 'customer_id', 'handler_name', 'package_type', 'complaint_description', 'complaint_type', 'complaint_subtype'],
              'handling': ['complaint_id', 'handler_id', 'hall_id', 'accept_time', 'customer_feedback', 'customer_name'],
              'customer': ['customer_id', 'customer_name', 'customer_level'],
              'employee': ['handler_id', 'handler_name', 'hall_id'],
              'hall': ['hall_id', 'hall_name', 'region'],
          }

          def dump_json(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def empty(value):
              return value is None or str(value).strip() == ''

          def write_csv(header, rows):
              stream = io.StringIO(newline='')
              writer = csv.writer(stream, lineterminator='\n')
              writer.writerow(header)
              writer.writerows([[row.get(key, '') for key in header] for row in rows])
              return stream.getvalue()

          def read_csv(text):
              if not isinstance(text, str) or not text.strip():
                  raise ValueError('上游表格为空或不是字符串')
              records = list(csv.reader(io.StringIO(text, newline=''), strict=True))
              if not records or not records[0] or len(set(records[0])) != len(records[0]):
                  raise ValueError('CSV 表头为空或重复')
              header = records[0]
              rows = []
              for line, cells in enumerate(records[1:], 2):
                  if len(cells) != len(header):
                      raise ValueError('CSV 第 {} 行列数与表头不一致'.format(line))
                  rows.append(dict(zip(header, cells)))
              return header, rows

          def index_rows(rows):
              result = {}
              for row in rows:
                  value = row.get('source_row_index', '')
                  if not re.fullmatch(r'0|[1-9]\d*', str(value)):
                      raise ValueError('source_row_index 缺失或不是非负整数')
                  index = int(value)
                  if index in result:
                      raise ValueError('source_row_index 重复：{}'.format(index))
                  result[index] = row
              return result

          def valid_id(value, column):
              patterns = {'complaint_id': r'TS\d{10}', 'customer_id': r'CUST\d{4}',
                          'handler_id': r'EMP\d{4}', 'hall_id': r'HALL\d{3}'}
              return isinstance(value, str) and re.fullmatch(patterns[column], value) is not None

          def relation(rows, source, target):
              mapping = defaultdict(set)
              for row in rows:
                  a, b = row.get(source, ''), row.get(target, '')
                  if empty(a) or empty(b) or '记录丢失' in str(a) or '记录丢失' in str(b):
                      continue
                  if source.endswith('_id') and not valid_id(a, source):
                      continue
                  if target.endswith('_id') and not valid_id(b, target):
                      continue
                  mapping[a].add(b)
              return mapping


          from datetime import datetime

          BASE_TIME = re.compile(r'^\d{4}/\d{1,2}/\d{1,2}\s+\d{1,2}:\d{2}(?::\d{2})?$')
          TIME_FORMATS = [
              '%Y/%m/%d %H:%M:%S', '%Y/%m/%d %H:%M', '%Y/%m/%d',
              '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M', '%Y-%m-%d',
              '%Y.%m.%d %H:%M:%S', '%Y.%m.%d %H:%M', '%Y.%m.%d',
              '%Y年%m月%d日 %H:%M:%S', '%Y年%m月%d日 %H:%M', '%Y年%m月%d日',
              '%d-%m-%Y %H:%M:%S', '%d-%m-%Y %H:%M',
              '%H:%M:%S %d-%m-%Y', '%H:%M %d-%m-%Y',
              '%m/%d/%Y %I:%M:%S %p', '%m/%d/%Y %I:%M %p',
              '%A, %d %B %Y %I:%M:%S %p', '%A, %d %B %Y %I:%M %p',
          ]

          def parse_time(raw):
              if empty(raw):
                  return raw, False, 'blank'
              value = str(raw).strip()
              if len(value) > 1 and value[0] in '\"\'' and value[-1] == value[0]:
                  value = value[1:-1].strip()
              formats = TIME_FORMATS
              if re.fullmatch(r'\d{14}', value):
                  formats = ['%Y%m%d%H%M%S']
              elif re.fullmatch(r'\d{12}', value):
                  formats = ['%Y%m%d%H%M']
              for fmt in formats:
                  try:
                      parsed = datetime.strptime(value, fmt)
                      return parsed.strftime('%Y/%m/%d %H:%M'), not bool(BASE_TIME.fullmatch(value)), None
                  except ValueError:
                      continue
              return raw, False, 'unrecognized_or_invalid'

          def main(record_csv, handling_csv):
              result, issues = {}, []
              for name, text in [('record', record_csv), ('handling', handling_csv)]:
                  header, rows = read_csv(text)
                  index_rows(rows)
                  count = 0
                  for row in rows:
                      raw = row['accept_time']
                      normalized, repaired, reason = parse_time(raw)
                      row['accept_time'] = normalized
                      count += int(repaired)
                      if reason:
                          issues.append({'table': name, 'source_row_index': int(row['source_row_index']), 'raw': raw, 'reason': reason})
                  result[name + '_time_csv'] = write_csv(header, rows)
                  result[name + '_fix_count'] = count
              result['time_issues_json'] = dump_json(issues)
              return result
